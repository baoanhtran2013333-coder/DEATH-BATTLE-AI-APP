<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Battle AI Master - Full Feat & Hax Analysis Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        .container { 
            width: 100%; 
            height: 100dvh; 
            max-width: 900px; 
            margin: 0 auto;
            background: #161b22; 
            display: flex; 
            flex-direction: column; 
            padding: 12px;
        }
        
        .brand-header { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; }
        .logo-box svg { width: 22px; height: 22px; fill: #f85149; }
        h1 { color: #f85149; margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }
        p.subtitle { color: #8b949e; font-size: 11px; margin: 2px 0 0 0; }

        .chat-section { 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            background: #0d1117; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            min-height: 0; 
        }
        
        .chat-header { background: #21262d; padding: 10px 12px; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #30363d; font-size: 12px; display: flex; justify-content: space-between; flex-shrink: 0; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; -webkit-overflow-scrolling: touch; }
        
        .msg { max-width: 95%; padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-start; }
        .msg.user { background: #238636; color: #ffffff; align-self: flex-end; font-weight: 500; }
        .msg.system { background: #21262d; color: #3fb950; align-self: center; font-size: 12px; font-weight: 700; text-align: center; border: 1px dashed #238636; }

        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        .chat-input-area button { padding: 10px 16px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/></svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Full Feat, Scan, Hax & Term Analysis Engine</p>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 DBT INTELLIGENCE ENGINE</span>
                <span style="color: #3fb950;">● SYSTEM ONLINE</span>
            </div>
            
            <div class="chat-messages" id="chatLogs">
                <div class="msg system">⚡ AI DEATH BATTLE PHÂN TÍCH,SCAN,GIẢI THÍCH MỌI KÈO</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Gõ kèo (saitama vs rimuru), tra khái niệm (ee là gì), hoặc tên nv..." onkeydown="if(event.key==='Enter') sendMessage()" onfocus="scrollToBottom()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // KHO KHÁI NIỆM & THUẬT NGỮ POWER SCALING / VSBW
        const TERMS_DB = {
            "ee": "📌 [KHÁI NIỆM: EXISTENCE ERASURE (XÓA SỔ TỒN TẠI)]:\n• Khả năng xóa bỏ mục tiêu khỏi thực tại ở cấp độ vật lý, nguyên tử, linh hồn hoặc khái niệm. Khi bị xóa bởi EE tiêu chuẩn, mục tiêu không thể tái sinh bằng các phương pháp phục hồi thông thường.",
            "hax": "📌 [KHÁI NIỆM: HAX (NĂNG LỰC ĐẶC BIỆT / BỎ QUA ĐỘ BỀN)]:\n• Những năng lực không phụ thuộc vào sức mạnh thể chất/AP (Attack Potency). Hax có thể thao túng linh hồn, khái niệm, thực tại, không-thời gian để đánh bại đối thủ dù họ có Tier cao hơn.",
            "ap": "📌 [KHÁI NIỆM: ATTACK POTENCY (CƯỜNG ĐỘ TẤN CÔNG)]:\n• Năng lượng công kích thực tế mà một đòn đánh tạo ra, không nhất thiết phải phá hủy môi trường diện rộng (DC). Ví dụ: Một đòn đấm tập trung năng lượng phá hủy cấp Multiverse trong kích thước nhỏ.",
            "tier": "📌 [KHÁI NIỆM: TIERING SYSTEM (HỆ THỐNG PHÂN CẤP SỨC MẠNH)]:\n• Bảng xếp hạng quy mô năng lượng từ Tier 10 (Con người) đến Tier 2 (Multiversal), Tier 1 (Hyper/Outerversal) và Tier 0 (Boundless).",
            "speed": "📌 [KHÁI NIỆM: SPEED TIERS (CẤP ĐỘ TỐC ĐỘ)]:\n• FTL (Nhanh hơn ánh sáng) -> Massively FTL+ -> Infinite (Di chuyển khoảng cách vô hạn trong thời gian ngắn) -> Immeasurable (Bỏ qua khái niệm thời gian/di chuyển vượt thời gian) -> Inaccessible.",
            "resistance": "📌 [KHÁI NIỆM: RESISTANCE / TANK (KHÁNG NĂNG LỰC)]:\n• Khả năng chịu đựng hoặc miễn nhiễm trước các năng lực Hax (như Kháng Linh Hồn, Kháng EE, Kháng Thao Túng Thời Gian)."
        };

        // KHO DỮ LIỆU NHÂN VẬT ĐẦY ĐỦ FEAT & SCAN
        const CHARACTERS_DB = {
            "goku": {
                name: "Son Goku (Dragon Ball Super)",
                tierName: "Low 2-C đến 2-A (Low Multiversal)",
                tierVal: 20,
                speed: "Immeasurable",
                feats: [
                    "• Scan/Feat AP: Đấm va chạm với Beerus làm rung chuyển toàn bộ Universe 7 (bao gồm Vũ trụ, Thiên Đường, Địa Ngục - Manga/Anime Ep 12).",
                    "• Scan/Feat EE Offense: Thi triển Hakai thiêu rụi bán phần cơ thể Fused Zamasu (DBS Manga Chap 25).",
                    "• Scan/Feat EE Defense: Dùng Ki thuần túy gồng nén và gạt phăng quả cầu Năng Lượng Hủy Diệt (Hakai) từ Thần Hủy Diệt Sidra (DBS Anime Ep 95)."
                ],
                offense: { ee: "Hakai (Manga), God Ki Attack.", soul: "Tác động linh hồn qua God Ki." },
                defense: { ee: "Resist EE hạn chế nhờ Ki áp đảo.", soul: "Kháng đòn linh hồn tiêu chuẩn." }
            },
            "saitama": {
                name: "Saitama (One Punch Man)",
                tierName: "4-A đến 3-C (Multi-Solar System / Galaxy)",
                tierVal: 10,
                speed: "Massively FTL+",
                feats: [
                    "• Scan/Feat AP: Hắt hơi làm thổi bay toàn bộ bầu khí quyển Sao Mộc (OPM Chap 168).",
                    "• Scan/Feat Spatial: Cầm, dịch chuyển và sút cổng Hyperspace Gate của Garou (OPM Chap 167-168).",
                    "• Scan/Feat EE & Soul: CHƯA CÓ FEAT dính hoặc kháng xóa sổ tồn tại/tấn công linh hồn trong Canon."
                ],
                offense: { ee: "Không có Hax EE (Sát thương vật lý AP thuần túy).", soul: "Không có Soul Attack." },
                defense: { ee: "Chưa có Feat Tank EE.", soul: "Chưa có Feat Kháng Linh hồn." }
            },
            "rimuru": {
                name: "Rimuru Tempest (Tensura Light Novel)",
                tierName: "2-A đến 1-C (Multiversal+ / Low Complex)",
                tierVal: 35,
                speed: "Immeasurable / Inaccessible",
                feats: [
                    "• Scan/Feat AP & Creation: Sở hữu Turn Null (Hư Hư Chi Vương), đủ năng lượng tạo lại toàn bộ thế giới/đa vũ trụ hơn 10,000 lần (LN Vol 16/21).",
                    "• Scan/Feat EE & Soul Offense: Băng Phong Long & Thôn Phệ Linh Hồn ở cấp độ thông tin (Information Particles).",
                    "• Scan/Feat Defense: Miễn nhiễm tuyệt đối với mọi đòn tấn công Linh hồn, Khái niệm, Tự nhiên và Phi tự nhiên nhờ Ciel & Ultimate Skill."
                ],
                offense: { ee: "Turn Null / Nodens xóa sổ linh hồn, khái niệm.", soul: "Ăn nuốt & diệt linh hồn khái niệm." },
                defense: { ee: "Kháng tuyệt đối EE (Immunity to EE).", soul: "Kháng tuyệt đối tấn công linh hồn." }
            },
            "anos": {
                name: "Anos Voldigoad (Maou Gakuin)",
                tierName: "2-A đến 1-B (Hyperversal)",
                tierVal: 40,
                speed: "Immeasurable",
                feats: [
                    "• Scan/Feat Hax Offense: Rút kiếm Venuzdonoa diệt vong mọi nguyên lý, lý lẽ, quy luật và khái niệm bất kể độ bền.",
                    "• Scan/Feat Regeneration: Tái sinh ngay cả khi Nguồn Căn (Root/Concept) bị tiêu diệt hoàn toàn."
                ],
                offense: { ee: "Venuzdonoa diệt vong lý lẽ/khái niệm.", soul: "Tấn công Nguồn Căn (Root)." },
                defense: { ee: "Bất hoại trước sự hủy diệt khái niệm.", soul: "Tái sinh từ Nguồn Căn bị hủy diệt." }
            }
        };

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatLogs = document.getElementById('chatLogs');
                chatLogs.scrollTop = chatLogs.scrollHeight;
            }, 100);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processIntentEngine(rawText); }, 100);
        }

        function getOrGenerateCharacter(nameRaw) {
            let clean = nameRaw.trim().toLowerCase();
            
            for (let key in CHARACTERS_DB) {
                if (clean.includes(key) || key.includes(clean)) {
                    return CHARACTERS_DB[key];
                }
            }

            let formattedName = nameRaw.trim().charAt(0).toUpperCase() + nameRaw.trim().slice(1);
            let dynamicChar = {
                name: `${formattedName}`,
                tierName: "Cấp độ VSBW Tiêu chuẩn",
                tierVal: 15,
                speed: "Massively FTL+",
                feats: [
                    `• Scan/Feat AP: Đang cập nhật trích dẫn chương/tập cho ${formattedName}...`,
                    `• Scan/Feat Hax: Chưa ghi nhận Scan Hax đặc biệt.`
                ],
                offense: { ee: "Đang quét dữ liệu chiêu thức...", soul: "Đang quét chiêu thức Linh hồn..." },
                defense: { ee: "Chưa ghi nhận Feat Kháng EE.", soul: "Kháng linh hồn cơ bản." }
            };

            CHARACTERS_DB[clean] = dynamicChar;
            return dynamicChar;
        }

        function processIntentEngine(rawText) {
            let lower = rawText.toLowerCase();

            // 1. KIỂM TRA GIẢI THÍCH THUẬT NGỮ / KHÁI NIỆM
            for (let term in TERMS_DB) {
                if (lower.includes(`${term} là gì`) || lower === term || lower.includes(`giải thích ${term}`)) {
                    addMessage(TERMS_DB[term], 'bot');
                    return;
                }
            }

            // 2. PHÂN TÍCH RÕ, ĐỦ CHI TIẾT ALL KÈO ĐẤU (CÓ "VS" HOẶC "ĐẤU VỚI")
            if (lower.includes(" vs ") || lower.includes(" đấu với ")) {
                let parts = lower.split(/ vs | đấu với /);
                let c1 = getOrGenerateCharacter(parts[0]);
                let c2 = getOrGenerateCharacter(parts[1]);

                let winner = (c1.tierVal >= c2.tierVal) ? c1 : c2;
                let loser = (c1.tierVal >= c2.tierVal) ? c2 : c1;
                
                let diffVal = Math.abs(c1.tierVal - c2.tierVal);
                let diff = "NO DIFF (Áp đảo hoàn toàn)";
                if (diffVal < 15 && diffVal >= 8) diff = "LOW DIFF (Thắng dễ dàng)";
                else if (diffVal < 8 && diffVal >= 3) diff = "MID DIFF (Thắng trung bình)";
                else if (diffVal < 3) diff = "HIGH DIFF (Thắng rất vất vả)";

                let res = `⚔️ [PHÂN TÍCH CHI TIẾT KÈO ĐẤU]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n` +
                          `=========================================\n\n` +
                          `📊 1. BẢNG SO SÁNH THÔNG SỐ VSBW:\n` +
                          `• ${c1.name}: Tier [${c1.tierName}] | Speed [${c1.speed}]\n` +
                          `• ${c2.name}: Tier [${c2.tierName}] | Speed [${c2.speed}]\n\n` +
                          `📜 2. TRÍCH DẪN FEAT & SCAN TIÊU BIỂU:\n` +
                          `📌 [${c1.name}]:\n${c1.feats.join("\n")}\n\n` +
                          `📌 [${c2.name}]:\n${c2.feats.join("\n")}\n\n` +
                          `🔮 3. PHÂN TÍCH HAX & PHÒNG THỦ (TANK/RESISTANCE):\n` +
                          `• Tấn công Hax/EE: ${winner.name} áp đảo với khả năng [${winner.offense.ee}].\n` +
                          `• Khả năng Phòng thủ/Resistance: ${loser.name} [${loser.defense.ee}].\n\n` +
                          `🏆 4. KẾT QUẢ CHUNG CUỘC:\n` +
                          `👉 ${winner.name.toUpperCase()} THẮNG (${diff})\n\n` +
                          `💡 Lý do: ${winner.name} vượt trội hoàn toàn về cấp độ sức mạnh chiều không gian (Tiering) và bộ Hax/Resistance bỏ qua hoàn toàn độ bền vật lý của ${loser.name}.\n` +
                          `-----------------------------------------\n` +
                          `💬 Bạn có thể phản biện hoặc đưa ra Scan đối lập để tranh luận tiếp!`;

                addMessage(res, 'bot');
                return;
            }

            // 3. TRUY VẤN TRA CỨU HỒ SƠ / FEAT / TANK ĐƠN LẺ
            let targetChar = getOrGenerateCharacter(rawText.replace(/(có|tank|ee|hakai|soul|linh hồn|không gian|spatial|ko|không|feat|scan|\?)/g, ""));

            let res = `📖 [HỒ SƠ SCAN & FEAT CHI TIẾT - ${targetChar.name.toUpperCase()}]:\n` +
                      `=========================================\n` +
                      `• Tier VSBW: ${targetChar.tierName}\n` +
                      `• Tốc độ: ${targetChar.speed}\n\n` +
                      `📜 FEAT & SCAN CHÍNH THỨC:\n${targetChar.feats.join("\n")}\n\n` +
                      `🔥 TẤN CÔNG (OFFENSE HAX):\n• EE: ${targetChar.offense.ee}\n• Soul: ${targetChar.offense.soul}\n\n` +
                      `🛡️ PHÒNG THỦ (TANK / RESISTANCE):\n• Tank EE: ${targetChar.defense.ee}\n• Tank Soul: ${targetChar.defense.soul}`;

            addMessage(res, 'bot');
        }
    </script>
</body>
</html>
