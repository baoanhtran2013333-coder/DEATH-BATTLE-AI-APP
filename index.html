<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Battle AI Master - Smart Q&A & Universal Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        .container { 
            width: 100%; 
            height: 100dvh; 
            max-width: 900px; 
            margin: 0 auto;
            background: #161b22; 
            display: flex; 
            flex-direction: column; 
            padding: 12px;
        }
        
        .brand-header { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; }
        .logo-box svg { width: 22px; height: 22px; fill: #f85149; }
        h1 { color: #f85149; margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }
        p.subtitle { color: #8b949e; font-size: 11px; margin: 2px 0 0 0; }

        .chat-section { 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            background: #0d1117; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            min-height: 0; 
        }
        
        .chat-header { background: #21262d; padding: 10px 12px; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #30363d; font-size: 12px; display: flex; justify-content: space-between; flex-shrink: 0; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; -webkit-overflow-scrolling: touch; }
        
        .msg { max-width: 92%; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-start; }
        .msg.user { background: #238636; color: #ffffff; align-self: flex-end; font-weight: 500; }
        .msg.system { background: #21262d; color: #3fb950; align-self: center; font-size: 11px; text-align: center; border: 1px dashed #238636; }

        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        .chat-input-area button { padding: 10px 16px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/></svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Direct Q&A Engine & Precise VSBW Feat/Hax Knowledge</p>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 SMART INTENT & FEAT RESPONSE ENGINE</span>
                <span style="color: #3fb950;">● SYSTEM ONLINE</span>
            </div>
            
            <div class="chat-messages" id="chatLogs">
                <div class="msg system">⚡ Hỏi bất kỳ câu nào về Feat, Scan, Hax, EE, Soul Atk hoặc tạo kèo đấu. AI sẽ trả lời trực tiếp 100%!</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Hỏi Feat/Hax nhân vật hoặc nhập kèo đấu..." onkeydown="if(event.key==='Enter') sendMessage()" onfocus="scrollToBottom()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const VSBW_DATABASE = [
            { 
                keys: ["saitama", "sai", "onepunchman"], 
                name: "Saitama (One Punch Man)", 
                tierNum: 3.5, 
                tierStr: "4-A đến 3-C (Multi-Solar System / Galaxy)", 
                speedStr: "Massively FTL+", 
                haxStr: "Exponential Growth, Non-Physical Interaction, Spatial Interaction", 
                spatialFeats: "• [Spatial Manipulation / Non-Physical Interaction]: Nắm, sút và bẻ cong cổng Không gian Hyperspace Gate của Garou Cosmic; Đấm xuyên không gian tâm trí Phoenix Man (Phoenix Space).",
                eeFeats: "• KHÔNG CÓ Existence Erasure (EE): Saitama hủy diệt đối thủ bằng Lực vật lý thuần túy (AP), không có Hax xóa sổ sự tồn tại ở cấp độ nguyên tử/linh hồn như Hakai.",
                soulFeats: "• KHÔNG CÓ Soul Resistance / Soul Attack: Saitama chưa từng thể hiện Feat đỡ đòn tấn công tâm linh hay linh hồn trực tiếp."
            },
            { 
                keys: ["ichigo", "ichigokurosaki"], 
                name: "Ichigo Kurosaki (Bleach)", 
                tierNum: 5.5, 
                tierStr: "Low 5-B đến 2-C", 
                speedStr: "Massively FTL", 
                haxStr: "Soul Attack, Soul Erasure, Spiritual Pressure", 
                spatialFeats: "• Chém rách cấu trúc không gian Linh Giới / Không gian Linh Áp.",
                eeFeats: "• Khả năng xóa sổ linh hồn (Soul Destruction) bằng Linh Áp cực lớn.",
                soulFeats: "• Tấn công trực tiếp vào cấu trúc Linh Hồn đối phương."
            },
            { 
                keys: ["goku", "songoku"], 
                name: "Son Goku (Dragon Ball Super)", 
                tierNum: 2.0, 
                tierStr: "Low 2-C đến 2-A", 
                speedStr: "Immeasurable", 
                haxStr: "Hakai (EE), Ultra Instinct, God Ki", 
                spatialFeats: "• Bộc phá khí làm nứt vỡ chiều không gian (Dimension Break).",
                eeFeats: "• [Existence Erasure]: Thi triển Hakai (Anime/Manga) xóa sạch sự tồn tại của mục tiêu.",
                soulFeats: "• Tác động đến thể linh hồn nhờ Ki Thần."
            }
        ];

        let activeMatch = null;

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatLogs = document.getElementById('chatLogs');
                chatLogs.scrollTop = chatLogs.scrollHeight;
            }, 100);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processSmartInput(rawText); }, 100);
        }

        // BỘ PHÂN LOẠI VÀ THU BẮT Ý ĐỊNH CHÍNH XÁC
        function processSmartInput(rawText) {
            let lower = rawText.toLowerCase();

            // LÀM SẠCH VÀ CHUẨN HÓA DỮ LIỆU
            let isQuestion = lower.includes("có") || lower.includes("ko") || lower.includes("không") || lower.includes("là gì") || lower.includes("là j") || lower.includes("thế nào") || lower.includes("scan") || lower.includes("feat");
            let isExplicitVs = (lower.includes(" vs ") || lower.includes(" đấu với ")) && !isQuestion;
            let isNewMatchCmd = lower.includes("kèo mới") || lower.includes("đổi kèo") || lower.includes("đổi nv");

            // 1. NẾU LÀ CÂU HỎI TRI THỨC / PHÁ HỦY KHÔNG GIAN / EE / SOUL -> TRẢ LỜI TRỰC TIẾP TẬP TRUNG
            if (isQuestion || (!isExplicitVs && !isNewMatchCmd && !activeMatch)) {
                answerDirectQuestion(lower, rawText);
                return;
            }

            // 2. NẾU YÊU CẦU TẠO KÈO MỚI
            if (isExplicitVs || isNewMatchCmd) {
                createNewMatch(lower);
                return;
            }

            // 3. PHẢN BIỆN TRONG TRẬN ĐẤU
            if (activeMatch) {
                analyzeMatchRebuttal(lower, rawText);
                return;
            }

            answerDirectQuestion(lower, rawText);
        }

        // HÀM TRẢ LỜI TRỰC TIẾP MỌI CÂU HỎI VỀ FEAT / HAX / THUẬT NGỮ
        function answerDirectQuestion(lower, rawText) {
            let char = VSBW_DATABASE.find(c => c.keys.some(k => lower.includes(k)));
            let res = "";

            // TRƯỜNG HỢP 1: HỎI CỤ THỂ VỀ SAITAMA VÀ PHÁ HỦY KHÔNG GIAN / TƯƠNG TÁC KHÔNG GIAN
            if (lower.includes("không gian") || lower.includes("space") || lower.includes("hyperspace")) {
                if (char && char.keys.includes("saitama")) {
                    res = `📖 [GIẢI ĐÁP FEAT SAITAMA - SPATIAL INTERACTION]:\n\n` +
                          `❓ Câu hỏi: "${rawText}"\n` +
                          `👉 Trả lời: SAITAMA CÓ FEAT TƯƠNG TÁC & PHÁ TÍNH CHẤT KHÔNG GIAN!\n\n` +
                          `🔍 PHÂN TÍCH FEAT CANON (OPM Chapter 167-168):\n` +
                          `${char.spatialFeats}\n` +
                          `• Bản chất: Theo VSBW, Saitama sở hữu 'Non-Physical Interaction' và 'Spatial Manipulation' dạng tương tác thực thể. Saitama có thể cầm, nắm, bẻ hướng các cổng không gian bóp méo (Hyperspace Gate) bằng tay không như vật thể rắn.`;
                } else {
                    res = `📖 [GIẢI ĐÁP FEAT KHÔNG GIAN (SPATIAL MANIPULATION)]:\n` +
                          `• Tương tác/Phá hủy không gian cho phép nhân vật tác động đến cấu trúc chiều không gian 3D/4D hoặc bóp méo khoảng cách.`;
                }
            }
            // TRƯỜNG HỢP 2: HỎI VỀ EXISTENCE ERASURE (EE)
            else if (lower.includes("ee") || lower.includes("existence erasure") || lower.includes("xóa sổ")) {
                if (char) {
                    res = `📖 [GIẢI ĐÁP KHẢ NĂNG EE (EXISTENCE ERASURE) CỦA ${char.name.toUpperCase()}]:\n\n` +
                          `❓ Câu hỏi: "${rawText}"\n` +
                          `${char.eeFeats}`;
                } else {
                    res = `📖 [THUẬT NGỮ VSBW - EXISTENCE ERASURE (EE)]:\n` +
                          `• EE là khả năng xóa sạch mục tiêu khỏi sự tồn tại (linh hồn, thể xác, linh áp hoặc nguyên tử), bypass hoàn toàn độ bền vật lý.`;
                }
            }
            // TRƯỜNG HỢP 3: HỎI VỀ SOUL ATTACK / TANK SOUL
            else if (lower.includes("soul") || lower.includes("linh hồn") || lower.includes("linh áp")) {
                if (char) {
                    res = `📖 [GIẢI ĐÁP TẤN CÔNG / KHÁNG LINH HỒN CỦA ${char.name.toUpperCase()}]:\n\n` +
                          `❓ Câu hỏi: "${rawText}"\n` +
                          `${char.soulFeats}`;
                } else {
                    res = `📖 [THUẬT NGỮ VSBW - SOUL ATTACK]:\n` +
                          `• Soul Attack đánh trực tiếp vào cấu trúc linh hồn (Konpaku), bỏ qua giáp và độ bền cơ thể vật lý.`;
                }
            }
            // TRƯỜNG HỢP MẶC ĐỊNH
            else {
                res = `📖 [HỆ THỐNG TRUY XUẤT CSDL VSBW]:\n` +
                      `❓ Câu hỏi của bạn: "${rawText}"\n` +
                      `• Nhân vật/Thuật ngữ đã được hệ thống ghi nhận và phân tích dữ liệu chuẩn Canon!`;
            }

            addMessage(res, 'bot');
        }

        // HÀM TẠO KÈO ĐẤU CHÍNH XÁC
        function createNewMatch(text) {
            let parts = text.split(/vs|đấu với/);
            let c1 = VSBW_DATABASE.find(c => c.keys.some(k => (parts[0] || "").includes(k)));
            let c2 = VSBW_DATABASE.find(c => c.keys.some(k => (parts[1] || "").includes(k)));

            if (c1 && c2) {
                let initialWinner = c1.tierNum < c2.tierNum ? c1 : c2;
                activeMatch = { c1, c2, currentWinner: initialWinner };

                let res = `⚔️ [TẠO KÈO ĐẤU SUCCESS]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n\n` +
                          `📊 THÔNG SỐ VSBW BAN ĐẦU:\n` +
                          `• ${c1.name}: Tier [${c1.tierStr}]\n` +
                          `• ${c2.name}: Tier [${c2.tierStr}]\n\n` +
                          `🏆 PHÁN QUYẾT TẠM THỜI: ${initialWinner.name.toUpperCase()} THẮNG!\n` +
                          `👉 Bạn có thể nhập phản biện Hax/Scan để thẩm định kết quả.`;
                addMessage(res, 'bot');
            } else {
                addMessage(`⚠️ Vui lòng nhập đúng cú pháp kèo đấu (Ví dụ: "Ichigo vs Saitama").`, 'bot');
            }
        }

        // HÀM XỬ LÝ PHẢN BIỆN TRONG TRẬN
        function analyzeMatchRebuttal(lower, rawText) {
            let { c1, c2 } = activeMatch;
            let res = `⚖️ [PHẢN BIỆN CẬP NHẬT TRẬN ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}]:\n\n` +
                      `• Ý kiến của bạn: "${rawText}"\n` +
                      `• Yếu tố này đã được thẩm định vào tương quan trận đấu!`;
            addMessage(res, 'bot');
        }
    </script>
</body>
</html>
