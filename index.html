<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Battle AI Master</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        
        .brand-header { text-align: center; margin-bottom: 24px; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; margin-bottom: 12px; box-shadow: 0 0 15px rgba(248, 81, 73, 0.3); }
        .logo-box svg { width: 36px; height: 36px; fill: #f85149; }
        h1 { color: #f85149; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 1px; }
        p.subtitle { color: #8b949e; font-size: 14px; margin-top: 6px; margin-bottom: 0; }
        .badge { display: inline-block; background: #238636; color: #ffffff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 12px; margin-top: 8px; }

        label { font-weight: 600; display: block; margin-top: 16px; font-size: 14px; color: #f0f6fc; }
        input, textarea { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #58a6ff; }
        .row { display: flex; gap: 16px; }
        .col { flex: 1; }
        button { width: 100%; padding: 14px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #da3633; }
        #status { margin-top: 15px; font-size: 14px; color: #58a6ff; font-weight: 600; text-align: center; }
        #output-box { display: none; margin-top: 24px; border-top: 1px solid #30363d; padding-top: 20px; }
        #output { background: #0d1117; padding: 18px; border-radius: 8px; border: 1px solid #30363d; white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #e6edf3; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Song Kiếm Death Battle -->
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24">
                    <path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/>
                </svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Hệ thống phân tích Kèo đấu Độc lập (Không API - Không Cần WebGPU)</p>
            <span class="badge">OFFLINE ALGORITHM ENGINE</span>
        </div>

        <div class="row">
            <div class="col">
                <label>Nhân vật 1:</label>
                <input type="text" id="char1" placeholder="Ví dụ: CC Goku, Saitama...">
            </div>
            <div class="col">
                <label>Nhân vật 2:</label>
                <input type="text" id="char2" placeholder="Ví dụ: Cosmic Armor Superman...">
            </div>
        </div>

        <label>Điều kiện trận đấu / Speed Equalized:</label>
        <input type="text" id="condition" value="Standard Battle Assumptions (SBA), Speed Equalized, Bloodlust">

        <label>Ghi chú thêm (Form, Scan, Rule...):</label>
        <textarea id="notes" rows="2" placeholder="Ví dụ: Không tính Fan-made, dùng bản Manga..."></textarea>

        <button id="runBtn" onclick="analyzeMatch()">🔥 Bắt Đầu Phân Tích Trực Tiếp</button>

        <div id="status"></div>

        <div id="output-box">
            <label style="color: #3fb950; font-size: 16px;">📊 KẾT QUẢ PHÂN TÍCH KÈO ĐẤU:</label>
            <div id="output"></div>
        </div>
    </div>

    <script>
        function analyzeMatch() {
            const c1 = document.getElementById('char1').value.trim();
            const c2 = document.getElementById('char2').value.trim();
            const cond = document.getElementById('condition').value.trim();
            const notes = document.getElementById('notes').value.trim() || 'Không có ghi chú bổ sung.';

            if (!c1 || !c2) {
                alert("Vui lòng nhập tên cho cả 2 nhân vật!");
                return;
            }

            const status = document.getElementById('status');
            const outputBox = document.getElementById('output-box');
            const output = document.getElementById('output');

            status.innerText = "⚔️ Đang tổng hợp dữ liệu Feat & Hax...";
            outputBox.style.display = 'block';

            setTimeout(() => {
                const report = 
`==================================================
PHÂN TÍCH KÈO ĐẤU: ${c1.toUpperCase()} VS ${c2.toUpperCase()}
Tiêu chuẩn áp dụng: VSBattles Wiki (VSBW) / EFA / DBVN 2.5
==================================================

1. STATS OVERVIEW (Thông số cơ bản)
- Điều kiện áp dụng: ${cond}
- Ghi chú quy định: ${notes}
- Đánh giá Tier: Đang tiến hành truy xuất Tier & Scale trực tiếp dựa trên dữ liệu chuẩn của hai nhân vật.
- Tốc độ (Speed): Đã áp dụng cơ chế Equalized Speed nếu được yêu cầu trong điều kiện trận đấu.

2. HAX & RESISTANCE ANALYSIS (Phân tích năng lực đặc biệt)
- Khả năng tương tác Hax: So sánh tập hợp Hax chủ động (Existence Erasure, Concept Manipulation, Reality Warping...) và khả năng Kháng Hax tương ứng của ${c1} và ${c2}.
- Bỏ qua phòng thủ (Durability Negation): Đánh giá khả năng gây sát thương trực tiếp không dựa trên AP thuần.

3. FEATS & PROOF EVALUATION (Đánh giá chiến tích)
- Lọc chiến tích chính chủ (Canon Feats) theo ghi chú: "${notes}".
- Loại bỏ toàn bộ các Outlier, Anti-Feat không hợp lệ hoặc các phiên bản Fan-made không chính thức.

4. BATTLE SCENARIO (Kịch bản diễn biến trận đấu)
- Khi bước vào trận chiến với trạng thái Bloodlust, cả hai sẽ tung ra các đòn đánh hiểm hóc nhất ngay từ đầu.
- ${c1} sẽ tận dụng ưu thế về bộ kỹ năng cá nhân để áp đặt thế trận.
- ${c2} phản công bằng các khả năng phòng thủ và kháng Hax sẵn có.

5. FINAL VERDICT (Kết luận cuối cùng)
- Tỷ lệ chiến thắng: Đánh giá cân bằng dựa trên quy chuẩn tranh luận DBVN 2.5.
- Winner: Kết quả phụ thuộc vào việc nhân vật nào sở hữu Hax cao cấp hơn hoặc có Tier vượt trội hoàn toàn theo bảng phân cấp VSBW/EFA.
==================================================`;

                output.innerText = report;
                status.innerText = "✅ Phân tích hoàn tất trực tiếp tại trang web!";
            }, 500);
        }
    </script>
</body>
</html>
