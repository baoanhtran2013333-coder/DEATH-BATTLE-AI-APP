<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Battle AI Master - Smart Auto-Search Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        .container { 
            width: 100%; 
            height: 100dvh; 
            max-width: 900px; 
            margin: 0 auto;
            background: #161b22; 
            display: flex; 
            flex-direction: column; 
            padding: 12px;
        }
        
        .brand-header { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; }
        .logo-box svg { width: 22px; height: 22px; fill: #f85149; }
        h1 { color: #f85149; margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }
        p.subtitle { color: #8b949e; font-size: 11px; margin: 2px 0 0 0; }

        .chat-section { 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            background: #0d1117; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            min-height: 0; 
        }
        
        .chat-header { background: #21262d; padding: 10px 12px; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #30363d; font-size: 12px; display: flex; justify-content: space-between; flex-shrink: 0; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; -webkit-overflow-scrolling: touch; }
        
        .msg { max-width: 92%; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-start; }
        .msg.user { background: #238636; color: #ffffff; align-self: flex-end; font-weight: 500; }
        .msg.system { background: #21262d; color: #3fb950; align-self: center; font-size: 12px; font-weight: 700; text-align: center; border: 1px dashed #238636; }

        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        .chat-input-area button { padding: 10px 16px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/></svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Universal Dynamic Search & Matchmaking Engine</p>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 DBT INTELLIGENCE ENGINE</span>
                <span style="color: #3fb950;">● SYSTEM ONLINE</span>
            </div>
            
            <div class="chat-messages" id="chatLogs">
                <div class="msg system">⚡ AI DEATH BATTLE PHÂN TÍCH,SCAN,GIẢI THÍCH MỌI KÈO</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Gõ tên nv (rimuru) hoặc kèo (saitama vs rimuru)..." onkeydown="if(event.key==='Enter') sendMessage()" onfocus="scrollToBottom()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // KHO DỮ LIỆU MẶC ĐỊNH
        const CHARACTERS_DB = {
            "goku": {
                name: "Son Goku (Dragon Ball Super)",
                tier: "Low 2-C đến 2-A",
                speed: "Immeasurable",
                offense: {
                    ee: "• [EXISTENCE ERASURE - ATK]: Có thể dùng Hakai (Manga) xóa sạch mục tiêu.",
                    soul: "• [SOUL ATK]: Tác động lên linh hồn nhờ God Ki.",
                    spatial: "• [SPATIAL ATK]: Bộc phát Ki xé rách không gian."
                },
                defense: {
                    ee: "• [EXISTENCE ERASURE - TANK]: Kháng EE hạn chế! Đã gồng gánh và nén quả cầu Năng lượng Hủy diệt (Hakai) của Thần Hủy Diệt Sidra (Anime Ep 95).",
                    soul: "• [SOUL TANK]: Kháng đòn linh hồn nếu Ki vượt trội hoàn toàn.",
                    spatial: "• [SPATIAL TANK]: Kháng bóp méo không gian cơ bản nhờ Ki Thần."
                }
            },
            "saitama": {
                name: "Saitama (One Punch Man)",
                tier: "4-A đến 3-C (Multi-Solar System / Galaxy)",
                speed: "Massively FTL+",
                offense: {
                    ee: "• [EXISTENCE ERASURE - ATK]: KHÔNG CÓ EE. Đòn đánh thuần túy gây sát thương vật lý (AP).",
                    soul: "• [SOUL ATK]: KHÔNG CÓ Soul Attack.",
                    spatial: "• [SPATIAL ATK]: Bẻ, sút cổng Hyperspace Gate (OPM Chap 167-168)."
                },
                defense: {
                    ee: "• [EXISTENCE ERASURE - TANK]: CHƯA CÓ FEAT TANK EE.",
                    soul: "• [SOUL TANK]: CHƯA CÓ Feat kháng Soul Attack.",
                    spatial: "• [SPATIAL TANK]: Kháng thao túng không gian trực tiếp ở cấp độ vật lý."
                }
            },
            "rimuru": {
                name: "Rimuru Tempest (Tensura Light Novel)",
                tier: "2-A đến 1-C (Multiversal+ / Low Complex)",
                speed: "Immeasurable / Inaccessible",
                offense: {
                    ee: "• [EXISTENCE ERASURE - ATK]: Hư Hư Chi Vương (Nodens) / Turn Null xóa sổ linh hồn, khái niệm, đa vũ trụ.",
                    soul: "• [SOUL ATK]: Ăn nuốt và tiêu diệt linh hồn ở cấp độ khái niệm.",
                    spatial: "• [SPATIAL ATK]: Cắt đứt không-thời gian tối cao."
                },
                defense: {
                    ee: "• [EXISTENCE ERASURE - TANK]: Kháng tuyệt đối xóa sổ tồn tại (Immunity to EE).",
                    soul: "• [SOUL TANK]: Kháng tuyệt đối tấn công linh hồn.",
                    spatial: "• [SPATIAL TANK]: Bất hoại trước mọi đòn tấn công không-thời gian."
                }
            },
            "ichigo": {
                name: "Ichigo Kurosaki (Bleach)",
                tier: "Low 5-B đến 2-C",
                speed: "Massively FTL",
                offense: {
                    ee: "• [EXISTENCE ERASURE - ATK]: Xóa sổ linh hồn thông qua Reiatsu Crush.",
                    soul: "• [SOUL ATK]: Tấn công trực tiếp vào Linh Hồn (Konpaku).",
                    spatial: "• [SPATIAL ATK]: Chém rách cấu trúc Linh Giới."
                },
                defense: {
                    ee: "• [EXISTENCE ERASURE - TANK]: Kháng xóa sổ linh hồn nhờ áp đảo Linh Áp.",
                    soul: "• [SOUL TANK]: Kháng đòn Linh Hồn từ đối thủ yếu hơn.",
                    spatial: "• [SPATIAL TANK]: Dùng Linh Áp chống lại bóp méo không gian."
                }
            }
        };

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatLogs = document.getElementById('chatLogs');
                chatLogs.scrollTop = chatLogs.scrollHeight;
            }, 100);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processIntentEngine(rawText); }, 100);
        }

        // TỰ ĐỘNG TÌM HOẶC TẠO DỮ LIỆU CHO NHÂN VẬT BẤT KỲ
        function getOrGenerateCharacter(nameRaw) {
            let clean = nameRaw.trim().toLowerCase();
            
            // Tìm trong DB
            for (let key in CHARACTERS_DB) {
                if (clean.includes(key) || key.includes(clean)) {
                    return CHARACTERS_DB[key];
                }
            }

            // Nếu nhân vật chưa có trong DB -> Tự động sinh Profile VSBW
            let formattedName = nameRaw.trim().charAt(0).toUpperCase() + nameRaw.trim().slice(1);
            let dynamicChar = {
                name: `${formattedName} (Custom/Auto-Scanned)`,
                tier: "Chưa xác định (Cần cập nhật Feat)",
                speed: "Massively FTL+",
                offense: {
                    ee: `• [EXISTENCE ERASURE - ATK]: AI đang quét dữ liệu chiêu thức EE của ${formattedName}...`,
                    soul: `• [SOUL ATK]: AI đang quét chiêu thức Linh hồn của ${formattedName}...`,
                    spatial: `• [SPATIAL ATK]: AI đang quét chiêu thức Không gian của ${formattedName}...`
                },
                defense: {
                    ee: `• [EXISTENCE ERASURE - TANK]: Chưa có dữ liệu Tank EE chính thức cho ${formattedName}.`,
                    soul: `• [SOUL TANK]: Chưa có dữ liệu Kháng Linh hồn cho ${formattedName}.`,
                    spatial: `• [SPATIAL TANK]: Kháng thao túng không gian cơ bản.`
                }
            };

            // Lưu lại vào DB động
            CHARACTERS_DB[clean] = dynamicChar;
            return dynamicChar;
        }

        function processIntentEngine(rawText) {
            let lower = rawText.toLowerCase();

            // 1. KIỂM TRA KÈO ĐẤU (CÓ TỪ "VS" HOẶC "ĐẤU VỚI")
            if (lower.includes(" vs ") || lower.includes(" đấu với ")) {
                let parts = lower.split(/ vs | đấu với /);
                let char1 = getOrGenerateCharacter(parts[0]);
                let char2 = getOrGenerateCharacter(parts[1]);

                let res = `⚔️ [TẠO KÈO ĐẤU SUCCESS]: ${char1.name.toUpperCase()} VS ${char2.name.toUpperCase()}\n\n` +
                          `📊 THÔNG SỐ VSBW BAN ĐẦU:\n` +
                          `• ${char1.name}: Tier [${char1.tier}] | Speed [${char1.speed}]\n` +
                          `• ${char2.name}: Tier [${char2.tier}] | Speed [${char2.speed}]\n\n` +
                          `👉 Nhập bất kỳ câu hỏi hoặc lập luận Tank/Hax để AI thẩm định phân tích!`;

                addMessage(res, 'bot');
                return;
            }

            // 2. PHÂN BIỆT TANK / PHÒNG THỦ HOẶC TẤN CÔNG
            let isTankOrDefend = lower.includes("tank") || lower.includes("kháng") || lower.includes("đỡ") || lower.includes("chịu") || lower.includes("bị") || lower.includes("dính");
            
            // Tách lấy tên nhân vật trong câu hỏi
            let targetChar = getOrGenerateCharacter(rawText.replace(/(có|tank|ee|hakai|soul|linh hồn|không gian|spatial|ko|không|\?)/g, ""));

            let res = "";

            if (lower.includes("ee") || lower.includes("hakai") || lower.includes("xóa sổ")) {
                let featData = isTankOrDefend ? targetChar.defense.ee : targetChar.offense.ee;
                res = `📖 [GIẢI ĐÁP VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `❓ Câu hỏi: "${rawText}"\n` +
                      `🎯 Phân loại Intent: ${isTankOrDefend ? "TÍNH NĂNG PHÒNG THỦ / TANK / RESISTANCE" : "TÍNH NĂNG TẤN CÔNG (OFFENSE)"}\n\n` +
                      `${featData}`;
            }
            else if (lower.includes("soul") || lower.includes("linh hồn")) {
                let featData = isTankOrDefend ? targetChar.defense.soul : targetChar.offense.soul;
                res = `📖 [GIẢI ĐÁP VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `❓ Câu hỏi: "${rawText}"\n` +
                      `🎯 Phân loại Intent: ${isTankOrDefend ? "TÍNH NĂNG PHÒNG THỦ / TANK / RESISTANCE" : "TÍNH NĂNG TẤN CÔNG (OFFENSE)"}\n\n` +
                      `${featData}`;
            }
            // 3. NẾU CHỈ GÕ TÊN NV (VD: "rimuru" HOẶC "goku")
            else {
                res = `📖 [HỒ SƠ SCAN VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `• Tier: ${targetChar.tier}\n` +
                      `• Speed: ${targetChar.speed}\n\n` +
                      `🔥 TẤN CÔNG (OFFENSE):\n${targetChar.offense.ee}\n${targetChar.offense.soul}\n\n` +
                      `🛡️ PHÒNG THỦ (TANK/RESISTANCE):\n${targetChar.defense.ee}\n${targetChar.defense.soul}`;
            }

            addMessage(res, 'bot');
        }
    </script>
</body>
</html>
