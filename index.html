<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Battle AI Master - Full Feat & Hax Analysis Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        .container { 
            width: 100%; 
            height: 100dvh; 
            max-width: 900px; 
            margin: 0 auto;
            background: #161b22; 
            display: flex; 
            flex-direction: column; 
            padding: 12px;
        }
        
        .brand-header { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; }
        .logo-box svg { width: 22px; height: 22px; fill: #f85149; }
        h1 { color: #f85149; margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }
        p.subtitle { color: #8b949e; font-size: 11px; margin: 2px 0 0 0; }

        .chat-section { 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            background: #0d1117; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            min-height: 0; 
        }
        
        .chat-header { background: #21262d; padding: 10px 12px; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #30363d; font-size: 12px; display: flex; justify-content: space-between; flex-shrink: 0; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; -webkit-overflow-scrolling: touch; }
        
        .msg { max-width: 95%; padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-start; }
        .msg.user { background: #238636; color: #ffffff; align-self: flex-end; font-weight: 500; }
        .msg.system { background: #21262d; color: #3fb950; align-self: center; font-size: 12px; font-weight: 700; text-align: center; border: 1px dashed #238636; }

        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        .chat-input-area button { padding: 10px 16px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/></svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Full Feat, Scan, Hax & Speed Correction Engine</p>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 DBT INTELLIGENCE ENGINE</span>
                <span style="color: #3fb950;">● SYSTEM ONLINE</span>
            </div>
            
            <div class="chat-messages" id="chatLogs">
                <div class="msg system">⚡ AI DEATH BATTLE PHÂN TÍCH, SCAN, GIẢI THÍCH MỌI KÈO</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Gõ kèo (gojo vs sukuna), tra khái niệm (ee là gì), hoặc tên nv..." onkeydown="if(event.key==='Enter') sendMessage()" onfocus="scrollToBottom()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const TERMS_DB = {
            "ee": "📌 [KHÁI NIỆM: EXISTENCE ERASURE (XÓA SỔ TỒN TẠI)]:\n• Khả năng xóa bỏ mục tiêu khỏi thực tại ở cấp độ vật lý, nguyên tử, linh hồn hoặc khái niệm.",
            "hax": "📌 [KHÁI NIỆM: HAX (NĂNG LỰC ĐẶC BIỆT / BỎ QUA ĐỘ BỀN)]:\n• Năng lực thao túng thực tại, vô hạn, linh hồn, khái niệm... không phụ thuộc độ bền vật lý.",
            "ap": "📌 [KHÁI NIỆM: ATTACK POTENCY (CƯỜNG ĐỘ TẤN CÔNG)]:\n• Năng lượng công kích thực tế tạo ra trong một điểm/đòn đánh.",
            "mhs+": "📌 [KHÁI NIỆM: MASSIVELY HYPERSONIC+ (MHS+)]:\n• Tốc độ di chuyển/phản xạ từ Mach 1000 đến Mach 8810 (gấp hàng ngàn lần tốc độ âm thanh)."
        };

        // CẬP NHẬT DATABASE CHUẨN XÁC DỮ LIỆU VSBW CHO GOJO VA CAC NHÂN VẬT KHÁC
        const CHARACTERS_DB = {
            "gojo": {
                name: "Gojo Satoru (Jujutsu Kaisen)",
                tierName: "7-A đến 7-B (Town to City Level)",
                tierVal: 8,
                speed: "Massively Hypersonic+ (MHS+)", // Đã chỉnh chuẩn theo VSBW
                feats: [
                    "• Scan/Feat Speed: Di chuyển diệt 1000 dị hình nhân trong 299 giây tại Shibuya (JJK Chap 89).",
                    "• Scan/Feat Hax Offense: Hollow Purple (Tử) nghiền nát vật chất ở cấp độ nguyên tử.",
                    "• Scan/Feat Hax Defense: Infinity (Vô Hạn) phân tách khoảng cách vô tận, ngăn chặn mọi đòn đánh có vận tốc hữu hạn."
                ],
                offense: { ee: "Hollow Purple (Xóa bỏ/nghiền nát vật chất mức nguyên tử).", soul: "Tác động Linh hồn tiêu chuẩn thông qua Chú Lực." },
                defense: { ee: "Chưa có Feat kháng EE cấp khái niệm.", soul: "Kháng linh hồn tiêu chuẩn nhờ Lượng Chú Lực khổng lồ." }
            },
            "saitama": {
                name: "Saitama (One Punch Man)",
                tierName: "4-A đến 3-C (Multi-Solar System / Galaxy)",
                tierVal: 10,
                speed: "Massively FTL+",
                feats: [
                    "• Scan/Feat AP: Hắt hơi thổi bay khí quyển Sao Mộc (OPM Chap 168).",
                    "• Scan/Feat Spatial: Cầm và dịch chuyển Hyperspace Gate (OPM Chap 167)."
                ],
                offense: { ee: "Sát thương vật lý AP thuần túy.", soul: "Không có Soul Attack." },
                defense: { ee: "Chưa có Feat Tank EE.", soul: "Chưa có Feat Kháng Linh hồn." }
            },
            "rimuru": {
                name: "Rimuru Tempest (Tensura Light Novel)",
                tierName: "2-A đến 1-C (Multiversal+ / Low Complex)",
                tierVal: 35,
                speed: "Immeasurable / Inaccessible",
                feats: [
                    "• Scan/Feat AP: Turn Null tạo lại thế giới 10,000+ lần (LN Vol 16/21)."
                ],
                offense: { ee: "Turn Null xóa sổ linh hồn, khái niệm.", soul: "Thôn phệ linh hồn." },
                defense: { ee: "Kháng tuyệt đối EE.", soul: "Kháng tuyệt đối tấn công linh hồn." }
            }
        };

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatLogs = document.getElementById('chatLogs');
                chatLogs.scrollTop = chatLogs.scrollHeight;
            }, 100);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processIntentEngine(rawText); }, 100);
        }

        function getOrGenerateCharacter(nameRaw) {
            let clean = nameRaw.trim().toLowerCase();
            
            for (let key in CHARACTERS_DB) {
                if (clean.includes(key) || key.includes(clean)) {
                    return CHARACTERS_DB[key];
                }
            }

            let formattedName = nameRaw.trim().charAt(0).toUpperCase() + nameRaw.trim().slice(1);
            
            // Xử lý mặc định hợp lý cho NV mới chưa có trong DB (dùng MHS+ hoặc FTL tùy chọn)
            let dynamicChar = {
                name: `${formattedName}`,
                tierName: "Cấp độ VSBW Tiêu chuẩn",
                tierVal: 10,
                speed: "Massively Hypersonic+ (MHS+)", 
                feats: [
                    `• Scan/Feat AP: Đang cập nhật dữ liệu cho ${formattedName}...`
                ],
                offense: { ee: "Chưa ghi nhận EE cấp cao.", soul: "Tấn công linh hồn cơ bản." },
                defense: { ee: "Chưa có Feat kháng EE chính thức.", soul: "Kháng linh hồn tiêu chuẩn." }
            };

            CHARACTERS_DB[clean] = dynamicChar;
            return dynamicChar;
        }

        function processIntentEngine(rawText) {
            let lower = rawText.toLowerCase();

            // Xử lý phản biện tốc độ từ người dùng (ví dụ người dùng nhắn: "đâu gojo có là massively HS+ thôi")
            if ((lower.includes("gojo") || lower.includes("satoru")) && (lower.includes("hs+") || lower.includes("hypersonic") || lower.includes("mhs"))) {
                CHARACTERS_DB["gojo"].speed = "Massively Hypersonic+ (MHS+)";
                let resCorrection = `✅ [ĐÃ CẬP NHẬT TỐC ĐỘ GOJO]:\n` +
                                     `• Nhân vật: Gojo Satoru\n` +
                                     `• Speed chuẩn VSBW: Massively Hypersonic+ (MHS+)\n` +
                                     `• Căn cứ: Phản xạ và di chuyển diệt 1000 dị hình nhân trong 299 giây tại sự kiện Shibuya (JJK Manga Chap 89).`;
                addMessage(resCorrection, 'bot');
                return;
            }

            // Kiểm tra giải thích thuật ngữ
            for (let term in TERMS_DB) {
                if (lower.includes(`${term} là gì`) || lower === term) {
                    addMessage(TERMS_DB[term], 'bot');
                    return;
                }
            }

            // Phân tích kèo đấu
            if (lower.includes(" vs ") || lower.includes(" đấu với ")) {
                let parts = lower.split(/ vs | đấu với /);
                let c1 = getOrGenerateCharacter(parts[0]);
                let c2 = getOrGenerateCharacter(parts[1]);

                let winner = (c1.tierVal >= c2.tierVal) ? c1 : c2;
                let loser = (c1.tierVal >= c2.tierVal) ? c2 : c1;
                
                let diffVal = Math.abs(c1.tierVal - c2.tierVal);
                let diff = "NO DIFF";
                if (diffVal < 15 && diffVal >= 8) diff = "LOW DIFF";
                else if (diffVal < 8 && diffVal >= 3) diff = "MID DIFF";
                else if (diffVal < 3) diff = "HIGH DIFF";

                let res = `⚔️ [PHÂN TÍCH KÈO ĐẤU]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n` +
                          `=========================================\n\n` +
                          `📊 1. THÔNG SỐ VSBW:\n` +
                          `• ${c1.name}: Tier [${c1.tierName}] | Speed [${c1.speed}]\n` +
                          `• ${c2.name}: Tier [${c2.tierName}] | Speed [${c2.speed}]\n\n` +
                          `📜 2. FEATS & SCANS NỔI BẬT:\n` +
                          `📌 [${c1.name}]:\n${c1.feats.join("\n")}\n\n` +
                          `📌 [${c2.name}]:\n${c2.feats.join("\n")}\n\n` +
                          `🏆 3. KẾT QUẢ CHUNG CUỘC:\n` +
                          `👉 ${winner.name.toUpperCase()} THẮNG (${diff})`;

                addMessage(res, 'bot');
                return;
            }

            // Tra cứu đơn lẻ
            let targetChar = getOrGenerateCharacter(rawText.replace(/(có|tank|ee|hakai|soul|linh hồn|ko|không|feat|scan|\?)/g, ""));

            let res = `📌 [SCAN HỒ SƠ & FEATS TOÀN DIỆN - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `📊 THÔNG SỐ VSBW:\n` +
                      `Tier: ${targetChar.tierName}\n` +
                      `Speed: ${targetChar.speed}\n\n` +
                      `📜 FEATS & SCANS NỔI BẬT:\n${targetChar.feats.join("\n")}\n\n` +
                      `🔥 BỘ HAX TẤN CÔNG (OFFENSE):\nEE: ${targetChar.offense.ee}\nSoul: ${targetChar.offense.soul}\n\n` +
                      `🛡️ BỘ HAX PHÒNG THỦ (TANK / RESISTANCE):\nTank EE: ${targetChar.defense.ee}\nTank Soul: ${targetChar.defense.soul}`;

            addMessage(res, 'bot');
        }
    </script>
</body>
</html>
