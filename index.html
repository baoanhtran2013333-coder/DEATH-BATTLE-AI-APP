<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Battle Engine - Full Feat & Matchup</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background-color: #0d1117; color: #c9d1d9; font-size: 13px; }
        .container { max-width: 900px; margin: 0 auto; padding: 12px; height: 100vh; display: flex; flex-direction: column; }
        .chat-section { border: 1px solid #30363d; border-radius: 8px; background: #0d1117; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #21262d; padding: 10px; font-weight: bold; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; white-space: pre-wrap; }
        .msg { padding: 12px; border-radius: 8px; max-width: 95%; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; }
        .msg.user { background: #238636; color: #fff; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; }
        input { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; outline: none; }
        button { padding: 10px 16px; background: #f85149; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 DEATH BATTLE ENGINE (FULL FEATS FIX)</span>
                <span style="color:#3fb950">● ONLINE</span>
            </div>
            <div class="chat-messages" id="chatLogs">
                <div class="msg bot">⚡ Hệ thống đã cập nhật và sửa lỗi nhận diện Feats. Bạn có thể gõ "feat goku", "goku vs saitama", "gojo",...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Nhập: feat goku, saitama vs rimuru, gojo..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // DATABASE ĐẦY ĐỦ FEAT / SCAN / HAX
        const CHARACTERS_DB = {
            "goku": {
                name: "Son Goku (Dragon Ball Super)",
                tierName: "Low 2-C đến 2-A (Low Multiversal)",
                tierVal: 25,
                speed: "Immeasurable (Trong Bản Năng Vô Cực / Ki God)",
                feats: [
                    "• Scan/Feat AP: Đấm va chạm với Beerus làm rung chuyển toàn bộ Universe 7 (bao gồm Vũ trụ, Thiên Đường, Địa Ngục - DBS Ep 12).",
                    "• Scan/Feat Speed: Di chuyển và phản xạ vượt qua khả năng Bỏ Qua Thời Gian (Time-Skip) của Hit (DBS Ep 39).",
                    "• Scan/Feat EE Offense: Thi triển Hakai thiêu rụi bán phần cơ thể Fused Zamasu (DBS Manga Chap 25).",
                    "• Scan/Feat EE Defense: Dùng Ki nén và gạt phăng quả cầu Năng Lượng Hủy Diệt (Hakai) từ Thần Hủy Diệt Sidra (DBS Ep 95)."
                ],
                offense: { ee: "Hakai (Xóa sổ sự tồn tại ở cấp độ vật lý lẫn linh hồn).", soul: "Tác động linh hồn qua God Ki." },
                defense: { ee: "Resist EE (Kháng EE mức độ năng lượng Ki áp đảo).", soul: "Kháng đòn đánh linh hồn tiêu chuẩn." }
            },
            "saitama": {
                name: "Saitama (One Punch Man)",
                tierName: "4-A đến 3-C (Multi-Solar System / Galaxy)",
                tierVal: 15,
                speed: "Massively FTL+",
                feats: [
                    "• Scan/Feat AP: Va chạm Serious Punch xóa khai trừ hàng ngàn ngôi sao trên bầu trời (OPM Chap 167).",
                    "• Scan/Feat AP: Hắt hơi làm thổi bay toàn bộ bầu khí quyển Sao Mộc (OPM Chap 168).",
                    "• Scan/Feat Hax: Tương tác vật lý cầm/sút cổng Hyperspace Gate và du hành ngược thời gian (OPM Chap 168)."
                ],
                offense: { ee: "Không có EE khái niệm (Sát thương AP thuần túy).", soul: "Không có đòn đánh linh hồn." },
                defense: { ee: "Chưa có Feat kháng EE khái niệm.", soul: "Chưa có Feat kháng linh hồn." }
            },
            "gojo": {
                name: "Gojo Satoru (Jujutsu Kaisen)",
                tierName: "7-A (City Level)",
                tierVal: 8,
                speed: "Massively Hypersonic+ (MHS+)",
                feats: [
                    "• Scan/Feat Speed: Di chuyển diệt 1000 dị hình nhân trong 299 giây tại Shibuya (JJK Chap 89).",
                    "• Scan/Feat Hax Offense: Hollow Purple (Tử) nghiền nát/xóa bỏ vật chất ở cấp độ nguyên tử.",
                    "• Scan/Feat Hax Defense: Infinity (Vô Hạn) phân tách khoảng cách vô tận."
                ],
                offense: { ee: "Hollow Purple (Xóa bỏ/nghiền nát vật chất nguyên tử).", soul: "Tác động linh hồn qua Chú Lực." },
                defense: { ee: "Chưa có Feat kháng EE cấp khái niệm.", soul: "Kháng linh hồn tiêu chuẩn." }
            },
            "rimuru": {
                name: "Rimuru Tempest (Tensura LN)",
                tierName: "2-A đến 1-C (Multiversal+)",
                tierVal: 35,
                speed: "Immeasurable / Inaccessible",
                feats: [
                    "• Scan/Feat AP: Turn Null tạo lại toàn bộ đa vũ trụ hơn 10,000 lần (LN Vol 16/21).",
                    "• Scan/Feat Hax: Thôn phệ và xóa sổ linh hồn, thông tin và khái niệm."
                ],
                offense: { ee: "Turn Null xóa sổ linh hồn, khái niệm.", soul: "Thôn phệ & diệt linh hồn." },
                defense: { ee: "Kháng tuyệt đối EE.", soul: "Kháng tuyệt đối đòn đánh linh hồn." }
            },
            "tanjiro": {
                name: "Tanjiro Kamado (Demon Slayer)",
                tierName: "8-A (Multi-City Block Level)",
                tierVal: 5,
                speed: "Massively Hypersonic (MHS)",
                feats: [
                    "• Scan/Feat AP: Trảm đầu Muzan bằng các đòn Hơi Thở Mặt Trời.",
                    "• Scan/Feat Speed: Trạng thái Thế Giới Trong Suốt né tránh đòn đánh tốc độ cao của Akaza/Muzan."
                ],
                offense: { ee: "Không có EE.", soul: "Không có tấn công linh hồn trực tiếp." },
                defense: { ee: "Không có kháng EE.", soul: "Kháng linh hồn tiêu chuẩn." }
            },
            "mob": {
                name: "Shigeo Kageyama / Mob (Mob Psycho 100)",
                tierName: "7-B đến 7-A (City Level)",
                tierVal: 9,
                speed: "High Hypersonic / Massively Hypersonic",
                feats: [
                    "• Scan/Feat AP (???%): Nâng hàng triệu tấn đất đá, san phẳng thành phố bằng Telekinesis.",
                    "• Scan/Feat Hax: Hấp thụ và thao túng năng lượng tâm linh/thế giới linh hồn."
                ],
                offense: { ee: "Phân rã vật chất bằng Telekinesis.", soul: "Tấn công & thanh tẩy linh hồn mạnh mẽ." },
                defense: { ee: "Không có kháng EE.", soul: "Miễn nhiễm thao túng tâm linh/linh hồn." }
            }
        };

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            chatLogs.scrollTop = chatLogs.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processBattle(rawText); }, 100);
        }

        // HÀM LỌC SẠCH TỪ THỪA ĐỂ TÌM TÊN NHÂN VẬT
        function cleanQuery(text) {
            return text.toLowerCase()
                       .replace(/(feat|feats|scan|scans|profile|hax|chi tiết|cho|về|thông tin|xem)\s+/g, "")
                       .trim();
        }

        function getCharacter(nameRaw) {
            let clean = cleanQuery(nameRaw);
            for (let key in CHARACTERS_DB) {
                if (clean.includes(key) || key.includes(clean)) {
                    return CHARACTERS_DB[key];
                }
            }
            return null;
        }

        function processBattle(rawText) {
            let lower = rawText.toLowerCase();

            // 1. XỬ LÝ KÈO ĐẤU (VS)
            if (lower.includes(" vs ") || lower.includes(" đấu với ")) {
                let parts = lower.split(/ vs | đấu với /);
                let c1 = getCharacter(parts[0]);
                let c2 = getCharacter(parts[1]);

                if (!c1 || !c2) {
                    addMessage(`⚠️ Không tìm thấy 1 trong 2 nhân vật. Hãy thử gõ: goku, saitama, gojo, rimuru, mob, tanjiro...`, 'bot');
                    return;
                }

                let winner = (c1.tierVal >= c2.tierVal) ? c1 : c2;
                let loser = (c1.tierVal >= c2.tierVal) ? c2 : c1;
                let diff = (c1.tierVal === c2.tierVal) ? "HIGH DIFF" : (Math.abs(c1.tierVal - c2.tierVal) > 10 ? "NO DIFF" : "MID DIFF");

                let res = `⚔️ [PHÂN TÍCH KÈO ĐẤU]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n` +
                          `=========================================\n\n` +
                          `📊 1. THÔNG SỐ VSBW:\n` +
                          `• ${c1.name}: Tier [${c1.tierName}] | Speed [${c1.speed}]\n` +
                          `• ${c2.name}: Tier [${c2.tierName}] | Speed [${c2.speed}]\n\n` +
                          `📜 2. FEATS & SCANS NỔI BẬT:\n` +
                          `📌 [${c1.name}]:\n${c1.feats.join("\n")}\n\n` +
                          `📌 [${c2.name}]:\n${c2.feats.join("\n")}\n\n` +
                          `🔮 3. BỘ HAX & RESISTANCE:\n` +
                          `• ${c1.name}: EE [${c1.offense.ee}]\n` +
                          `• ${c2.name}: EE [${c2.offense.ee}]\n\n` +
                          `🏆 4. KẾT QUẢ CHUNG CUỘC:\n` +
                          `👉 ${winner.name.toUpperCase()} THẮNG (${diff})\n` +
                          `💡 Lý do: ${winner.name} vượt trội hơn về Tier AP/DC và bộ Hax so với ${loser.name}.`;

                addMessage(res, 'bot');
            } 
            // 2. XỬ LÝ TRA CỨU FEAT / SCAN ĐƠN LẺ
            else {
                let c = getCharacter(rawText);
                if (c) {
                    let res = `📌 [SCAN HỒ SƠ & FEATS - ${c.name.toUpperCase()}]:\n\n` +
                              `📊 Tier VSBW: ${c.tierName}\n` +
                              `⚡ Tốc độ: ${c.speed}\n\n` +
                              `📜 FEATS & SCANS CHÍNH THỨC:\n${c.feats.join("\n")}\n\n` +
                              `🔥 BỘ HAX TẤN CÔNG (OFFENSE):\n• EE: ${c.offense.ee}\n• Soul: ${c.offense.soul}\n\n` +
                              `🛡️ BỘ HAX PHÒNG THỦ (TANK / RESISTANCE):\n• Tank EE: ${c.defense.ee}\n• Tank Soul: ${c.defense.soul}`;
                    addMessage(res, 'bot');
                } else {
                    addMessage(`⚠️ Không tìm thấy nhân vật. Hãy thử gõ: "feat goku", "saitama", "gojo", "rimuru", "mob", "tanjiro"...`, 'bot');
                }
            }
        }
    </script>
</body>
</html>
