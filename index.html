<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Death Battle Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: #0d1117; color: #c9d1d9; font-size: 13px; }
        .container { max-width: 900px; margin: 0 auto; padding: 12px; height: 100vh; display: flex; flex-direction: column; }
        .chat-section { border: 1px solid #30363d; border-radius: 8px; background: #0d1117; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #21262d; padding: 10px; font-weight: bold; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; white-space: pre-wrap; line-height: 1.5; }
        .msg { padding: 12px; border-radius: 8px; max-width: 95%; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; }
        .msg.user { background: #238636; color: #fff; align-self: flex-end; }
        .msg.loading { background: #21262d; color: #8b949e; font-style: italic; }
        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; }
        input { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; outline: none; }
        button { padding: 10px 16px; background: #da3633; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:disabled { background: #484f58; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 AI DEATH BATTLE ENGINE</span>
                <span id="status" style="color:#3fb950">● ONLINE</span>
            </div>
            <div class="chat-messages" id="chatLogs">
                <div class="msg bot">⚡ AI DEATH BATTLE đã sẵn sàng! Nhập MỌI nhân vật (Sung Jin Woo, Goku, Mob, Naruto, Luffy, Saitama...) - AI sẽ tra cứu & phân tích Full Feats, Scans, Tier VSBW chính xác 100%.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Nhập kèo (naruto vs luffy, sung jin woo vs mob...)" onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Phân Tích AI 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // 🔑 Dán Gemini API Key của bạn vào giữa 2 dấu ngoặc kép bên dưới:
        const API_KEY = "YOUR_GEMINI_API_KEY";

        const SYSTEM_PROMPT = `Bạn là AI DEATH BATTLE ENGINE chuyên phân tích sức mạnh nhân vật Anime/Manga/Comic theo chuẩn VSBW (Vs Battles Wiki).
Nhiệm vụ: Cung cấp FEAT, SCAN, HAX CHI TIẾT CỤ THỂ TỪ MANGA/ANIME NGUYÊN TÁC. KHÔNG ĐƯỢC NÓI CHUNG CHUNG.

Định dạng trả về bắt buộc:

⚔️ [PHÂN TÍCH KÈO ĐẤU]: A VS B
=========================================

📊 1. THÔNG SỐ VSBW:
• [Tên A]: Tier [Tier cụ thể] | Speed [Speed cụ thể]
• [Tên B]: Tier [Tier cụ thể] | Speed [Speed cụ thể]

📜 2. FEATS & SCANS NỔI BẬT:
📌 [Tên A]:
• Scan/Feat AP: (Nêu rõ sự kiện/chương/tập cụ thể trong manga/anime)
• Scan/Feat Speed: (Nêu rõ feat tốc độ né đòn/di chuyển cụ thể)
• Scan/Feat Hax: (Nêu rõ cơ chế kỹ năng/dạng sức mạnh)

📌 [Tên B]:
• Scan/Feat AP: (Nêu rõ sự kiện/chương/tập cụ thể trong manga/anime)
• Scan/Feat Speed: (Nêu rõ feat tốc độ né đòn/di chuyển cụ thể)
• Scan/Feat Hax: (Nêu rõ cơ chế kỹ năng/dạng sức mạnh)

🔮 3. BỘ HAX & RESISTANCE:
• [Tên A]: EE [Mức độ EE] | Soul [Khả năng tác động/kháng linh hồn]
• [Tên B]: EE [Mức độ EE] | Soul [Khả năng tác động/kháng linh hồn]

🏆 4. KẾT QUẢ CHUNG CUỘC:
👉 [TÊN NGƯỜI THẮNG] THẮNG ([Mức độ Diff])
💡 Lý do: (Giải thích ngắn gọn 2-3 câu dựa trên so sánh Tier, Feats và Hax).`;

        function addMessage(text, type, id = null) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            chatLogs.scrollTop = chatLogs.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const rawText = input.value.trim();

            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';
            input.disabled = true;
            btn.disabled = true;

            const loadingId = 'loading-' + Date.now();
            addMessage("🤖 AI đang tra cứu Feats & Scans từ Manga/Anime...", 'loading', loadingId);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: 'user', parts: [{ text: SYSTEM_PROMPT + "\n\nYêu cầu phân tích: " + rawText }] }
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    addMessage(aiReply, 'bot');
                } else {
                    addMessage("⚠️ Lỗi: API Key chưa đúng hoặc không hợp lệ.", 'bot');
                }
            } catch (error) {
                if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                addMessage("⚠️ Lỗi kết nối API: " + error.message, 'bot');
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
