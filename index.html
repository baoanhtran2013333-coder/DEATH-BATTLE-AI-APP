                speed: "Massively Hypersonic+",
                feats: [
                    "• Infinity Feat: Bành trướng Vô Hạ Hạn phân tách khoảng cách vô tận.",
                    "• Unlimited Void Feat: Nhồi vô hạn thông tin làm tê liệt não bộ đối thủ."
                ],
                offense: { ee: "Hollow Purple xóa bỏ vật chất nguyên tử.", soul: "Nhồi thông tin qua Unlimited Void.", hax: "Infinity, Hollow Purple." },
                defense: { ee: "Vô Hạ Hạn chặn đòn có vận tốc.", soul: "Kháng tác động tinh thần tiêu chuẩn.", hax: "Lá chắn Vô Hạ Hạn." }
            }
        };

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            chatLogs.scrollTop = chatLogs.scrollHeight;
        }

        function initChat() {
            const chatLogs = document.getElementById('chatLogs');
            chatLogs.innerHTML = '';
            addMessage(WELCOME_MESSAGE, 'bot');
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processBattle(rawText); }, 100);
        }

        function cleanQuery(text) {
            return text.toLowerCase()
                       .replace(/(feat|feats|scan|scans|profile|hax|chi tiết|cho|về|thông tin|xem|pt|phân tích)\s+/g, "")
                       .trim();
        }

        function getCharacter(nameRaw) {
            let clean = cleanQuery(nameRaw);
            for (let key in CHARACTERS_DB) {
                if (clean === key || clean.includes(key) || key.includes(clean)) {
                    return CHARACTERS_DB[key];
                }
            }
            return null;
        }

        function processBattle(rawText) {
            let lower = rawText.toLowerCase();

            if (lower.includes(" vs ") || lower.includes(" đấu với ")) {
                let parts = lower.split(/ vs | đấu với /);
                let c1 = getCharacter(parts[0]);
                let c2 = getCharacter(parts[1]);

                if (!c1 || !c2) {
                    addMessage(`⚠️ Không tìm thấy 1 trong 2 nhân vật! Vui lòng thử các tên chuẩn: featherine, hajun, akuto sai, void shiki, yogiri, mechika, cc goku, xenogoku, zeno, goku, anos, rimuru, sung jin woo, saitama, yhwach, shibai, sukuna, gojo, naruto, sasuke, madara, luffy, ichigo...`, 'bot');
                    return;
                }

                let winner = (c1.tierVal >= c2.tierVal) ? c1 : c2;
                let loser = (c1.tierVal >= c2.tierVal) ? c2 : c1;
                
                let diffVal = Math.abs(c1.tierVal - c2.tierVal);
                let diff = "NO DIFF (Áp đảo tuyệt đối)";
                if (diffVal < 20 && diffVal >= 10) diff = "LOW DIFF (Thắng dễ dàng)";
                else if (diffVal < 10 && diffVal >= 4) diff = "MID DIFF (Trận đấu vừa sức)";
                else if (diffVal < 4) diff = "HIGH DIFF (Thắng suýt soát)";

                let res = `⚔️ PHÂN TÍCH DIỄN BIẾN TRẬN ĐẤU CHI TIẾT ⚔️\n` +
                          `🔥 ${c1.name.toUpperCase()}  VS  ${c2.name.toUpperCase()} 🔥\n` +
                          `─────────────────────────────────────────\n\n` +

                          `📊 I. BẢNG SO SÁNH THÔNG SỐ VSBW & TỐC ĐỘ:\n` +
                          `• [${c1.name}]\n` +
                          `  - Franchise: ${c1.verse}\n` +
                          `  - Tiering System: ${c1.tierName}\n` +
                          `  - Speed: ${c1.speed}\n\n` +
                          `• [${c2.name}]\n` +
                          `  - Franchise: ${c2.verse}\n` +
                          `  - Tiering System: ${c2.tierName}\n` +
                          `  - Speed: ${c2.speed}\n\n` +

                          `📜 II. TRÍCH DẪN SCAN & FEATS CHUẨN TÁC PHẨM:\n` +
                          `📌 [${c1.name}]:\n${c1.feats.join("\n")}\n\n` +
                          `📌 [${c2.name}]:\n${c2.feats.join("\n")}\n\n` +

                          `🔮 III. ĐỐI CHIẾU BỘ HAX (OFFENSE VS DEFENSE):\n` +
                          `• ${c1.name}:\n` +
                          `  - Tấn công (EE / Soul / Hax): ${c1.offense.ee} | ${c1.offense.soul}\n` +
                          `  - Phòng thủ / Kháng: ${c1.defense.ee} | ${c1.defense.hax}\n\n` +
                          `• ${c2.name}:\n` +
                          `  - Tấn công (EE / Soul / Hax): ${c2.offense.ee} | ${c2.offense.soul}\n` +
                          `  - Phòng thủ / Kháng: ${c2.defense.ee} | ${c2.defense.hax}\n\n` +

                          `🎬 IV. KỊCH BẢN GIẢ ĐỊNH DIỄN BIẾN TRẬN ĐẤU:\n` +
                          `1. Tốc độ & Tiếp cận: ${c1.speed.includes("FTL") && !c2.speed.includes("FTL") ? c1.name + " sở hữu tốc độ vượt trội hoàn toàn về phản xạ và di chuyển." : c2.speed.includes("FTL") && !c1.speed.includes("FTL") ? c2.name + " làm chủ trận đấu nhờ tốc độ nhanh hơn." : "Cả hai có tốc độ tương đương nhau khi nhập cuộc."}\n` +
                          `2. Va chạm Hax: ${winner.name} sử dụng hệ thống Hax áp đảo (${winner.offense.hax}). ${loser.name} nỗ lực chống đỡ bằng (${loser.defense.hax}).\n` +
                          `3. Dứt điểm: Do chênh lệch về ${diffVal >= 3 ? "cấp độ Tier sức mạnh và quy mô phá hủy (AP/DC)" : "tốc độ và cơ chế khắc chế đòn đánh"}, ${loser.name} hoàn toàn thất thế và nhận thất bại.\n\n` +

                          `🏆 V. KẾT LUẬN CHUNG CUỘC:\n` +
                          `👉 NGUYÊN NHÂN THẮNG: ${winner.name.toUpperCase()} THẮNG (${diff})\n` +
                          `💡 LÝ DO CHI TIẾT: ${winner.name} nằm ở mức ${winner.tierName}, áp đảo về ${winner.tierVal > loser.tierVal ? "chỉ số thể chất, AP và Hax" : "kỹ năng và tốc độ"} so với ${loser.tierName} của ${loser.name}.`;

                addMessage(res, 'bot');
            } 
            else {
                let c = getCharacter(rawText);
                if (c) {
                    let res = `📌 HỒ SƠ & PHÂN TÍCH CHI TIẾT - ${c.name.toUpperCase()}\n` +
                              `─────────────────────────────────────────\n\n` +
                              `🏛️ Franchise / Verse: ${c.verse}\n` +
                              `📊 Tiering VSBW: ${c.tierName}\n` +
                              `⚡ Cấp độ Tốc độ: ${c.speed}\n\n` +
                              `📜 TRÍCH DẪN FEATS & SCANS CHÍNH THỨC:\n${c.feats.join("\n")}\n\n` +
                              `🔥 BỘ HAX TẤN CÔNG (OFFENSE):\n` +
                              `• Existence Erasure (Xóa sổ): ${c.offense.ee}\n` +
                              `• Soul Attack (Linh hồn): ${c.offense.soul}\n` +
                              `• Hax Đặc Trưng: ${c.offense.hax}\n\n` +
                              `🛡️ BỘ HAX PHÒNG THỦ & KHÁNG (DEFENSE / TANK):\n` +
                              `• Kháng Xóa Sổ (Tank EE): ${c.defense.ee}\n` +
                              `• Kháng Linh Hồn: ${c.defense.soul}\n` +
                              `• Cơ chế phòng thủ: ${c.defense.hax}`;
                    addMessage(res, 'bot');
                } else {
                    addMessage(`⚠️ Không tìm thấy 1 trong 2 nhân vật! Vui lòng thử các tên chuẩn: featherine, hajun, akuto sai, void shiki, yogiri, mechika, cc goku, xenogoku, zeno, goku, anos, rimuru, sung jin woo, saitama, yhwach, shibai, sukuna, gojo, naruto...`, 'bot');
                }
            }
        }

        window.onload = initChat;
    </script>
</body>
</html>
