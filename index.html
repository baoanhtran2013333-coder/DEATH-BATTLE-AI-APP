<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Battle AI Master - Precise Intent & Response Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        .container { 
            width: 100%; 
            height: 100dvh; 
            max-width: 900px; 
            margin: 0 auto;
            background: #161b22; 
            display: flex; 
            flex-direction: column; 
            padding: 12px;
        }
        
        .brand-header { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; }
        .logo-box svg { width: 22px; height: 22px; fill: #f85149; }
        h1 { color: #f85149; margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }
        p.subtitle { color: #8b949e; font-size: 11px; margin: 2px 0 0 0; }

        .chat-section { 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            background: #0d1117; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            min-height: 0; 
        }
        
        .chat-header { background: #21262d; padding: 10px 12px; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #30363d; font-size: 12px; display: flex; justify-content: space-between; flex-shrink: 0; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; -webkit-overflow-scrolling: touch; }
        
        .msg { max-width: 92%; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-start; }
        .msg.user { background: #238636; color: #ffffff; align-self: flex-end; font-weight: 500; }
        .msg.system { background: #21262d; color: #3fb950; align-self: center; font-size: 12px; font-weight: 700; text-align: center; border: 1px dashed #238636; }

        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        .chat-input-area button { padding: 10px 16px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/></svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Universal Anime Terms & Ultra-Precise Intent Engine</p>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 DBT INTELLIGENCE ENGINE</span>
                <span style="color: #3fb950;">● SYSTEM ONLINE</span>
            </div>
            
            <div class="chat-messages" id="chatLogs">
                <!-- DÒNG THÔNG BÁO MÀU XANH ĐÃ ĐƯỢC CẬP NHẬT CHÍNH XÁC -->
                <div class="msg system">⚡ AI DEATH BATTLE PHÂN TÍCH,SCAN,GIẢI THÍCH MỌI KÈO</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Nhập câu hỏi (vd: goku có tank ee ko, saitama vs ichigo)..." onkeydown="if(event.key==='Enter') sendMessage()" onfocus="scrollToBottom()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const CHARACTERS_DB = {
            goku: {
                name: "Son Goku (Dragon Ball Super)",
                tier: "Low 2-C đến 2-A",
                speed: "Immeasurable",
                offense: {
                    ee: "• [EXISTENCE ERASURE - ATK]: Goku có thể thi triển Hakai (Manga) để xóa sạch sự tồn tại của mục tiêu.",
                    soul: "• [SOUL ATK]: Tác động lên linh hồn nhờ God Ki.",
                    spatial: "• [SPATIAL ATK]: Bộc phát Ki xé rách chiều không gian (Dimension Shatter)."
                },
                defense: {
                    ee: "• [EXISTENCE ERASURE - TANK / RESISTANCE]: GOKU CÓ KHẢ NĂNG TANK / RESIST EE HẠN CHẾ!\n  - Feat Canon DBS Anime Ep 95: Goku ở dạng Base / SSJ Blue đã dùng Ki thuần túy gồng gánh và nén quả cầu Năng lượng Hủy diệt (Hakai energy) do Thần Hủy Diệt Sidra ban cho sát thủ.\n  - Theo VSBW: Goku sở hữu 'Limited Existence Erasure Resistance' nhờ mức năng lượng Ki vượt trội.",
                    soul: "• [SOUL TANK]: Cực kỳ bền bỉ trước các đòn ma thuật/linh hồn nếu lượng Ki của Goku áp đảo hoàn toàn đối thủ.",
                    spatial: "• [SPATIAL TANK]: Kháng bóp méo không gian cơ bản nhờ Ki Thần."
                }
            },
            saitama: {
                name: "Saitama (One Punch Man)",
                tier: "4-A đến 3-C (Multi-Solar System / Galaxy)",
                speed: "Massively FTL+",
                offense: {
                    ee: "• [EXISTENCE ERASURE - ATK]: Saitama KHÔNG CÓ Hax EE. Đòn đánh gây sát thương vật lý thuần túy (AP).",
                    soul: "• [SOUL ATK]: KHÔNG CÓ Soul Attack.",
                    spatial: "• [SPATIAL ATK]: Cầm, bẻ, sút cổng Hyperspace Gate (OPM Chap 167-168); đấm thủng không gian tâm trí Phoenix Man."
                },
                defense: {
                    ee: "• [EXISTENCE ERASURE - TANK]: Saitama CHƯA CÓ FEAT TANK EE. Chưa từng bị tấn công bởi năng lượng xóa sổ tồn tại ở cấp độ khái niệm/nguyên tử.",
                    soul: "• [SOUL TANK]: KHÔNG CÓ Feat kháng Soul Attack hay Linh áp.",
                    spatial: "• [SPATIAL TANK]: Kháng thao túng không gian trực tiếp (Spatial Manipulation Immunity) ở cấp độ vật lý."
                }
            },
            ichigo: {
                name: "Ichigo Kurosaki (Bleach)",
                tier: "Low 5-B đến 2-C",
                speed: "Massively FTL",
                offense: {
                    ee: "• [EXISTENCE ERASURE - ATK]: Xóa sổ linh hồn (Soul Erasure) thông qua Linh Áp (Reiatsu Crush).",
                    soul: "• [SOUL ATK]: Tấn công trực tiếp vào Linh Hồn (Konpaku), bypass độ bền vật lý.",
                    spatial: "• [SPATIAL ATK]: Chém rách cấu trúc Linh Giới."
                },
                defense: {
                    ee: "• [EXISTENCE ERASURE - TANK]: Kháng xóa sổ linh hồn nhờ áp đảo Linh Áp.",
                    soul: "• [SOUL TANK]: Kháng đòn tấn công Linh Hồn / Linh Áp từ các đối thủ yếu hơn.",
                    spatial: "• [SPATIAL TANK]: Dùng Linh Áp chống lại bóp méo không gian Linh Giới."
                }
            }
        };

        let activeMatch = null;

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatLogs = document.getElementById('chatLogs');
                chatLogs.scrollTop = chatLogs.scrollHeight;
            }, 100);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processIntentEngine(rawText); }, 100);
        }

        function processIntentEngine(rawText) {
            let lower = rawText.toLowerCase();

            // CHUẨN HÓA CÁC TỪ VIẾT TẮT VÀ KHÔNG DẤU
            lower = lower.replace(/\b(ko gian|kg|khong gian|space|hyperspace)\b/g, "spatial");
            lower = lower.replace(/\b(k|ko|khong)\b/g, "không");
            lower = lower.replace(/\b(sai|saitam|opm)\b/g, "saitama");
            lower = lower.replace(/\b(ichi|icg)\b/g, "ichigo");

            // PHÂN BIỆT TANK / PHÒNG THỦ VÀ TẤN CÔNG
            let isTankOrDefend = lower.includes("tank") || lower.includes("kháng") || lower.includes("đỡ") || lower.includes("chịu") || lower.includes("bị") || lower.includes("dính");
            let isMatchCmd = (lower.includes(" vs ") || lower.includes(" đấu với ")) && !lower.includes("không");

            if (isMatchCmd) {
                createMatch(lower);
                return;
            }

            let charKey = "goku";
            if (lower.includes("saitama")) charKey = "saitama";
            else if (lower.includes("ichigo")) charKey = "ichigo";
            else if (lower.includes("goku")) charKey = "goku";

            let targetChar = CHARACTERS_DB[charKey];
            let res = "";

            if (lower.includes("ee") || lower.includes("hakai") || lower.includes("xóa sổ")) {
                let featData = isTankOrDefend ? targetChar.defense.ee : targetChar.offense.ee;
                res = `📖 [GIẢI ĐÁP VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `❓ Câu hỏi: "${rawText}"\n` +
                      `🎯 Phân loại Intent: ${isTankOrDefend ? "TÍNH NĂNG PHÒNG THỦ / TANK / RESISTANCE" : "TÍNH NĂNG TẤN CÔNG (OFFENSE)"}\n\n` +
                      `${featData}`;
            }
            else if (lower.includes("soul") || lower.includes("linh hồn") || lower.includes("linh áp")) {
                let featData = isTankOrDefend ? targetChar.defense.soul : targetChar.offense.soul;
                res = `📖 [GIẢI ĐÁP VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `❓ Câu hỏi: "${rawText}"\n` +
                      `🎯 Phân loại Intent: ${isTankOrDefend ? "TÍNH NĂNG PHÒNG THỦ / TANK / RESISTANCE" : "TÍNH NĂNG TẤN CÔNG (OFFENSE)"}\n\n` +
                      `${featData}`;
            }
            else if (lower.includes("spatial") || lower.includes("không gian")) {
                let featData = isTankOrDefend ? targetChar.defense.spatial : targetChar.offense.spatial;
                res = `📖 [GIẢI ĐÁP VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `❓ Câu hỏi: "${rawText}"\n` +
                      `🎯 Phân loại Intent: ${isTankOrDefend ? "TÍNH NĂNG PHÒNG THỦ / TANK / RESISTANCE" : "TÍNH NĂNG TẤN CÔNG (OFFENSE)"}\n\n` +
                      `${featData}`;
            }
            else {
                res = `📖 [THÔNG TIN VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `• Tier: ${targetChar.tier} | Speed: ${targetChar.speed}\n` +
                      `${targetChar.defense.ee}\n` +
                      `${targetChar.defense.soul}`;
            }

            addMessage(res, 'bot');
        }

        function createMatch(text) {
            let parts = text.split(/vs|đấu với/);
            let c1Key = Object.keys(CHARACTERS_DB).find(k => parts[0].includes(k)) || "ichigo";
            let c2Key = Object.keys(CHARACTERS_DB).find(k => parts[1].includes(k)) || "saitama";

            let c1 = CHARACTERS_DB[c1Key];
            let c2 = CHARACTERS_DB[c2Key];

            activeMatch = { c1, c2 };

            let res = `⚔️ [TẠO KÈO ĐẤU SUCCESS]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n\n` +
                      `📊 THÔNG SỐ VSBW BAN ĐẦU:\n` +
                      `• ${c1.name}: Tier [${c1.tier}] | Speed [${c1.speed}]\n` +
                      `• ${c2.name}: Tier [${c2.tier}] | Speed [${c2.speed}]\n\n` +
                      `👉 Nhập bất kỳ câu hỏi hoặc lập luận Tank/Hax để AI thẩm định phân tích!`;

            addMessage(res, 'bot');
        }
    </script>
</body>
</html>
