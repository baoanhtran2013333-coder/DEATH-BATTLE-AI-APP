<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Battle AI Master</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        
        /* Logo & Header */
        .brand-header { text-align: center; margin-bottom: 24px; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; margin-bottom: 12px; box-shadow: 0 0 15px rgba(248, 81, 73, 0.3); }
        .logo-box svg { width: 36px; height: 36px; fill: #f85149; }
        h1 { color: #f85149; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 1px; }
        p.subtitle { color: #8b949e; font-size: 14px; margin-top: 6px; margin-bottom: 0; }
        .badge { display: inline-block; background: #238636; color: #ffffff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 12px; margin-top: 8px; }

        label { font-weight: 600; display: block; margin-top: 16px; font-size: 14px; color: #f0f6fc; }
        input, textarea { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #58a6ff; }
        .row { display: flex; gap: 16px; }
        .col { flex: 1; }
        button { width: 100%; padding: 14px; background: #238636; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #2ea043; }
        #status { margin-top: 15px; font-size: 14px; color: #58a6ff; font-weight: 600; text-align: center; }
        #output-box { display: none; margin-top: 24px; border-top: 1px solid #30363d; padding-top: 20px; }
        #output { background: #0d1117; padding: 18px; border-radius: 8px; border: 1px solid #30363d; white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #e6edf3; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Header -->
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24">
                    <path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/>
                </svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Hệ thống phân tích Kèo đấu Độc lập (Chạy trực tiếp - Không API)</p>
            <span class="badge">DEBATE ENGINE 2.5</span>
        </div>

        <div class="row">
            <div class="col">
                <label>Nhân vật 1:</label>
                <input type="text" id="char1" placeholder="Ví dụ: CC Goku, Saitama...">
            </div>
            <div class="col">
                <label>Nhân vật 2:</label>
                <input type="text" id="char2" placeholder="Ví dụ: Cosmic Armor Superman...">
            </div>
        </div>

        <label>Điều kiện trận đấu / Speed Equalized:</label>
        <input type="text" id="condition" value="Standard Battle Assumptions (SBA), Speed Equalized, Bloodlust">

        <label>Ghi chú thêm:</label>
        <textarea id="notes" rows="2" placeholder="Ví dụ: Không fan-made, dùng bản Manga..."></textarea>

        <button id="runBtn" onclick="runBattleAnalysis()">🔥 Phân Tích Kèo Đấu Ngay</button>

        <div id="status"></div>

        <div id="output-box">
            <label style="color: #3fb950; font-size: 15px;">📊 KẾT QUẢ PHÂN TÍCH CHI TIẾT:</label>
            <div id="output"></div>
        </div>
    </div>

    <script>
        // Cơ sở dữ liệu nhân vật offline
        const db = {
            "goku": { name: "Goku (Canon)", tier: "2-C đến 2-A", power: 95, speed: "Immeasurable", hax: ["Ki Manipulation", "Ultra Instinct", "Hakai", "Teleportation"], desc: "Sở hữu sức mạnh phá hủy đa vũ trụ nhẹ và phản xạ bản năng vô cực." },
            "cc goku": { name: "CC Goku (SDBH)", tier: "Complex Multiverse (1-C / Low 1-A)", power: 150, speed: "Inaccessible", hax: ["Keysword Manipulation", "Concept Erasure", "Space-Time Manipulation", "Omni-Ki"], desc: "Phiên bản Capsule Corp sở hữu Keysword vô hiệu hóa mọi Hax và scale vượt không-thời gian." },
            "saitama": { name: "Saitama (OPM)", tier: "Multi-Solar System đến Galaxy (4-A / 3-C)", power: 75, speed: "FTL+", hax: ["Reactive Evolution", "Interactive Causality", "Non-Physical Interaction"], desc: "Khả năng tăng trưởng sức mạnh vô hạn theo thời gian và kháng các đòn vật lý." },
            "superman": { name: "Superman (Base)", tier: "2-A đến 1-C", power: 110, speed: "Infinite", hax: ["Heat Vision", "Super Hearing", "Invulnerability"], desc: "Sức mạnh thể chất cùng khả năng hấp thụ năng lượng mặt trời." },
            "cas": { name: "Cosmic Armor Superman", tier: "High Outerverse (1-A / High 1-A)", power: 300, speed: "Irrelevant", hax: ["Plot Manipulation", "Concept Adaptation", "Dimensional Transcendence"], desc: "Thực thể siêu việt thao túng cốt truyện và nhận biết được người đọc." }
        };

        function getCharData(name) {
            const cleanName = name.toLowerCase().trim();
            for (let key in db) {
                if (cleanName.includes(key)) return db[key];
            }
            // Trường hợp nhân vật mới chưa có trong DB
            return {
                name: name,
                tier: "Đang cập nhật (Ước tính Tier 3 hoặc 2)",
                power: 80,
                speed: "Massively FTL",
                hax: ["Vật lý nâng cao", "Năng lượng đặc biệt", "Kháng hiệu ứng cơ bản"],
                desc: "Nhân vật được phân tích dựa trên quy chuẩn chỉ số chung của VSBW."
            };
        }

        function runBattleAnalysis() {
            const c1Input = document.getElementById('char1').value.trim();
            const c2Input = document.getElementById('char2').value.trim();
            const cond = document.getElementById('condition').value.trim();
            const notes = document.getElementById('notes').value.trim() || 'Không có';

            if (!c1Input || !c2Input) {
                alert("Vui lòng nhập tên cho cả 2 nhân vật!");
                return;
            }

            const status = document.getElementById('status');
            const outputBox = document.getElementById('output-box');
            const output = document.getElementById('output');

            status.innerText = "⚔️ Thuật toán AI đang truy xuất Feat và tính toán Hax...";
            outputBox.style.display = 'block';

            setTimeout(() => {
                const p1 = getCharData(c1Input);
                const p2 = getCharData(c2Input);

                let winner = "";
                let ratio = "";

                if (p1.power > p2.power) {
                    winner = p1.name;
                    ratio = `${Math.min(95, 50 + (p1.power - p2.power))}% - ${Math.max(5, 50 - (p1.power - p2.power))}%`;
                } else if (p2.power > p1.power) {
                    winner = p2.name;
                    ratio = `${Math.max(5, 50 - (p2.power - p1.power))}% - ${Math.min(95, 50 + (p2.power - p1.power))}%`;
                } else {
                    winner = "Hòa / Cân bằng";
                    ratio = "50% - 50%";
                }

                const resultText = 
`==================================================
PHÂN TÍCH KÈO ĐẤU: ${p1.name.toUpperCase()} VS ${p2.name.toUpperCase()}
Chuẩn đánh giá: VSBattles Wiki / EFA / DBVN 2.5
==================================================

1. STATS OVERVIEW (Thông số chiến đấu)
* ${p1.name}:
  - Tier Scale: ${p1.tier}
  - Speed: ${p1.speed}
  - Mô tả: ${p1.desc}

* ${p2.name}:
  - Tier Scale: ${p2.tier}
  - Speed: ${p2.speed}
  - Mô tả: ${p2.desc}

* Quy định trận đấu: ${cond}
* Ghi chú bổ sung: ${notes}

2. HAX & RESISTANCE ANALYSIS (So sánh năng lực)
* Bộ Hax của ${p1.name}: ${p1.hax.join(", ")}
* Bộ Hax của ${p2.name}: ${p2.hax.join(", ")}
-> Đánh giá Tương tác: ${p1.power >= p2.power ? p1.name + ' có khả năng áp đảo hoặc vô hiệu hóa bộ Hax của đối phương nhờ Scale Tier vượt trội.' : p2.name + ' sở hữu Hax/Tier cao hơn, có thể dễ dàng hóa giải đòn đánh của đối thủ.'}

3. FEATS & PROOF EVALUATION (Kiểm chứng chiến tích)
- Đã loại bỏ các yếu tố Fan-made theo ghi chú: "${notes}".
- Xét về Feat chính chủ (Canon/Official), ${p1.power >= p2.power ? p1.name : p2.name} thể hiện tầm ảnh hưởng trên quy mô chiều không gian lớn hơn rõ rệt.

4. BATTLE SCENARIO (Kịch bản trận đấu)
- Khi bước vào trận chiến với trạng thái Bloodlust, cả hai lập tức tung toàn bộ sức mạnh.
- ${p1.power >= p2.power ? p1.name : p2.name} nhanh chóng chiếm thế chủ động nhờ khoảng cách về AP/DC và chiều không gian.
- Dù đối phương cố gắng bộc phát khả năng phòng thủ hoặc tăng trưởng, khoảng cách Tier quá lớn khiến kết quả sớm được định đoạt.

5. FINAL VERDICT (Kết luận)
- Tỷ lệ thắng (${p1.name} vs ${p2.name}): ${ratio}
- WINNER: 🏆 ${winner.toUpperCase()}
==================================================`;

                output.innerText = resultText;
                status.innerText = "✅ Phân tích hoàn tất thành công!";
            }, 600);
        }
    </script>
</body>
</html>
