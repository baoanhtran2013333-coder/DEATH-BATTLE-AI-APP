<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Battle AI Master - Verdict & Battle Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; overflow: hidden; }
        
        .container { 
            width: 100%; 
            height: 100dvh; 
            max-width: 900px; 
            margin: 0 auto;
            background: #161b22; 
            display: flex; 
            flex-direction: column; 
            padding: 12px;
        }
        
        .brand-header { text-align: center; margin-bottom: 8px; flex-shrink: 0; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; }
        .logo-box svg { width: 22px; height: 22px; fill: #f85149; }
        h1 { color: #f85149; margin: 4px 0 0 0; font-size: 18px; font-weight: 800; }
        p.subtitle { color: #8b949e; font-size: 11px; margin: 2px 0 0 0; }

        .chat-section { 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            background: #0d1117; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            min-height: 0; 
        }
        
        .chat-header { background: #21262d; padding: 10px 12px; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #30363d; font-size: 12px; display: flex; justify-content: space-between; flex-shrink: 0; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; -webkit-overflow-scrolling: touch; }
        
        .msg { max-width: 92%; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-start; }
        .msg.user { background: #238636; color: #ffffff; align-self: flex-end; font-weight: 500; }
        .msg.system { background: #21262d; color: #3fb950; align-self: center; font-size: 12px; font-weight: 700; text-align: center; border: 1px dashed #238636; }

        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        .chat-input-area button { padding: 10px 16px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/></svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Automatic Battle Analysis & Instant Verdict Engine</p>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 DBT INTELLIGENCE ENGINE</span>
                <span style="color: #3fb950;">● SYSTEM ONLINE</span>
            </div>
            
            <div class="chat-messages" id="chatLogs">
                <div class="msg system">⚡ AI DEATH BATTLE PHÂN TÍCH,SCAN,GIẢI THÍCH MỌI KÈO</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Nhập kèo (saitama vs rimuru) hoặc tên nv..." onkeydown="if(event.key==='Enter') sendMessage()" onfocus="scrollToBottom()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // DATABASE NHÂN VẬT VỚI CHỈ SỐ TIER SỐ HÓA ĐỂ TỰ ĐỘNG CHẤM KẾT QUẢ KÈO ĐẤU
        const CHARACTERS_DB = {
            "goku": {
                name: "Son Goku (Dragon Ball Super)",
                tierName: "Low 2-C đến 2-A (Low Multiversal)",
                tierVal: 20, // Điểm Tier hóa để AI so sánh
                speed: "Immeasurable",
                offense: { ee: "Có Hakai xóa sổ sự tồn tại.", soul: "Tác động linh hồn bằng God Ki." },
                defense: { ee: "Resist EE hạn chế (Kháng quả cầu Hakai của Sidra ep 95).", soul: "Kháng linh hồn nhờ Ki áp đảo." }
            },
            "saitama": {
                name: "Saitama (One Punch Man)",
                tierName: "4-A đến 3-C (Multi-Solar System / Galaxy)",
                tierVal: 10,
                speed: "Massively FTL+",
                offense: { ee: "Không có Hax EE, sát thương vật lý thuần túy (AP).", soul: "Không có Soul Attack." },
                defense: { ee: "Chưa có Feat Tank EE.", soul: "Chưa có Feat Kháng Linh hồn." }
            },
            "rimuru": {
                name: "Rimuru Tempest (Tensura Light Novel)",
                tierName: "2-A đến 1-C (Multiversal+ / Low Complex)",
                tierVal: 35,
                speed: "Immeasurable / Inaccessible",
                offense: { ee: "Turn Null / Nodens xóa sổ linh hồn & khái niệm đa vũ trụ.", soul: "Ăn nuốt & tiêu diệt linh hồn khái niệm." },
                defense: { ee: "Kháng tuyệt đối EE (Immunity to EE).", soul: "Kháng tuyệt đối tấn công linh hồn." }
            },
            "ichigo": {
                name: "Ichigo Kurosaki (Bleach)",
                tierName: "Low 5-B đến 2-C (Low Multiversal)",
                tierVal: 18,
                speed: "Massively FTL",
                offense: { ee: "Soul Erasure thông qua Reiatsu Crush.", soul: "Tấn công trực tiếp vào Linh Hồn (Konpaku)." },
                defense: { ee: "Kháng xóa sổ linh hồn nhờ Linh Áp.", soul: "Kháng đòn Linh Hồn từ đối thủ yếu hơn." }
            },
            "anos": {
                name: "Anos Voldigoad (Maou Gakuin)",
                tierName: "2-A đến 1-B (Hyperversal)",
                tierVal: 40,
                speed: "Immeasurable",
                offense: { ee: "Venuzdonoa diệt vong mọi khái niệm và lý lẽ.", soul: "Tấn công nguồn căn gốc rễ (Root)." },
                defense: { ee: "Bất hoại trước sự hủy diệt khái niệm.", soul: "Kháng hoàn toàn đòn đánh vào nguồn căn." }
            }
        };

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatLogs = document.getElementById('chatLogs');
                chatLogs.scrollTop = chatLogs.scrollHeight;
            }, 100);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processIntentEngine(rawText); }, 100);
        }

        // TỰ ĐỘNG LẤY NẾU CÓ HOẶC SINH NV MỚI NẾU CHƯA CÓ TRONG KHO DL
        function getOrGenerateCharacter(nameRaw) {
            let clean = nameRaw.trim().toLowerCase();
            
            for (let key in CHARACTERS_DB) {
                if (clean.includes(key) || key.includes(clean)) {
                    return CHARACTERS_DB[key];
                }
            }

            let formattedName = nameRaw.trim().charAt(0).toUpperCase() + nameRaw.trim().slice(1);
            let dynamicChar = {
                name: `${formattedName}`,
                tierName: "Tương đương Tier VSBW Tiêu chuẩn",
                tierVal: 15,
                speed: "Massively FTL+",
                offense: { ee: "Đang quét dữ liệu chiêu thức...", soul: "Đang quét chiêu thức Linh hồn..." },
                defense: { ee: "Chưa ghi nhận Feat Kháng EE chính thức.", soul: "Kháng linh hồn tiêu chuẩn." }
            };

            CHARACTERS_DB[clean] = dynamicChar;
            return dynamicChar;
        }

        function processIntentEngine(rawText) {
            let lower = rawText.toLowerCase();

            // 1. TỰ ĐỘNG PHÂN TÍCH & BÁO KẾT QUẢ KÈO ĐẤU (KHI CÓ "VS" HOẶC "ĐẤU VỚI")
            if (lower.includes(" vs ") || lower.includes(" đấu với ")) {
                let parts = lower.split(/ vs | đấu với /);
                let c1 = getOrGenerateCharacter(parts[0]);
                let c2 = getOrGenerateCharacter(parts[1]);

                let winner = null;
                let loser = null;
                let diff = "No Diff";

                let diffVal = Math.abs(c1.tierVal - c2.tierVal);

                if (c1.tierVal > c2.tierVal) {
                    winner = c1;
                    loser = c2;
                } else if (c2.tierVal > c1.tierVal) {
                    winner = c2;
                    loser = c1;
                } else {
                    winner = c1;
                    loser = c2;
                    diff = "High/Inconclusive";
                }

                if (diffVal >= 15) diff = "NO DIFF (Áp đảo hoàn toàn)";
                else if (diffVal >= 8) diff = "LOW DIFF (Thắng dễ dàng)";
                else if (diffVal >= 3) diff = "MID DIFF (Thắng trung bình)";
                else if (diffVal > 0) diff = "HIGH DIFF (Thắng vất vả)";

                let res = `⚔️ [KẾT QUẢ PHÂN TÍCH KÈO ĐẤU]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n\n` +
                          `📊 SO SÁNH THÔNG SỐ VSBW:\n` +
                          `• ${c1.name}: Tier [${c1.tierName}] | Speed [${c1.speed}]\n` +
                          `• ${c2.name}: Tier [${c2.tierName}] | Speed [${c2.speed}]\n\n` +
                          `🔥 LÝ DO PHÂN TÍCH:\n` +
                          `1. AP / Tier: ${winner.name} vượt trội hoàn toàn về cấp độ sức mạnh không-thời gian/chiều không gian.\n` +
                          `2. Hax/Resistance: ${winner.name} sở hữu bộ Hax/Kháng áp đảo hoàn toàn so với ${loser.name}.\n\n` +
                          `🏆 KẾT QUẢ CHUNG CUỘC: ${winner.name.toUpperCase()} THẮNG (${diff})\n` +
                          `-----------------------------------\n` +
                          `💬 (Bạn có thể đưa ra lập luận hoặc phản biện bên dưới nếu không đồng ý với kết quả này!)`;

                addMessage(res, 'bot');
                return;
            }

            // 2. PHÂN BIỆT TANK / PHÒNG THỦ HOẶC TẤN CÔNG
            let isTankOrDefend = lower.includes("tank") || lower.includes("kháng") || lower.includes("đỡ") || lower.includes("chịu") || lower.includes("bị") || lower.includes("dính");
            let targetChar = getOrGenerateCharacter(rawText.replace(/(có|tank|ee|hakai|soul|linh hồn|không gian|spatial|ko|không|\?)/g, ""));

            let res = "";

            if (lower.includes("ee") || lower.includes("hakai") || lower.includes("xóa sổ")) {
                let featData = isTankOrDefend ? targetChar.defense.ee : targetChar.offense.ee;
                res = `📖 [GIẢI ĐÁP VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `❓ Câu hỏi: "${rawText}"\n` +
                      `🎯 Phân loại Intent: ${isTankOrDefend ? "TÍNH NĂNG PHÒNG THỦ / TANK / RESISTANCE" : "TÍNH NĂNG TẤN CÔNG (OFFENSE)"}\n\n` +
                      `• ${featData}`;
            }
            else if (lower.includes("soul") || lower.includes("linh hồn")) {
                let featData = isTankOrDefend ? targetChar.defense.soul : targetChar.offense.soul;
                res = `📖 [GIẢI ĐÁP VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `❓ Câu hỏi: "${rawText}"\n` +
                      `🎯 Phân loại Intent: ${isTankOrDefend ? "TÍNH NĂNG PHÒNG THỦ / TANK / RESISTANCE" : "TÍNH NĂNG TẤN CÔNG (OFFENSE)"}\n\n` +
                      `• ${featData}`;
            }
            // 3. NẾU CHỈ GÕ TÊN NV (VD: "rimuru" HOẶC "saitama")
            else {
                res = `📖 [HỒ SƠ SCAN VSBW - ${targetChar.name.toUpperCase()}]:\n\n` +
                      `• Tier: ${targetChar.tierName}\n` +
                      `• Speed: ${targetChar.speed}\n\n` +
                      `🔥 TẤN CÔNG (OFFENSE):\n• EE: ${targetChar.offense.ee}\n• Soul: ${targetChar.offense.soul}\n\n` +
                      `🛡️ PHÒNG THỦ (TANK/RESISTANCE):\n• Tank EE: ${targetChar.defense.ee}\n• Tank Soul: ${targetChar.defense.soul}`;
            }

            addMessage(res, 'bot');
        }
    </script>
</body>
</html>
