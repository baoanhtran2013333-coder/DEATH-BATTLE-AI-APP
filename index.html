<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Death Battle Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: #0d1117; color: #c9d1d9; font-size: 13px; }
        .container { max-width: 900px; margin: 0 auto; padding: 12px; height: 100vh; display: flex; flex-direction: column; }
        .chat-section { border: 1px solid #30363d; border-radius: 8px; background: #0d1117; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #21262d; padding: 10px; font-weight: bold; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; white-space: pre-wrap; line-height: 1.5; }
        .msg { padding: 12px; border-radius: 8px; max-width: 95%; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; }
        .msg.user { background: #238636; color: #fff; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 8px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; }
        input { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; outline: none; }
        button { padding: 10px 16px; background: #da3633; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Nhập kèo (naruto vs luffy, sung jin woo vs mob...)" onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Phân Tích 🚀</button>
            </div>
        </div>
    </div>

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            chatLogs.scrollTop = chatLogs.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => { processBattle(rawText); }, 100);
        }

        // BỘ LỌC TÊN TỰ ĐỘNG LÀM SẠCH KÝ TỰ THỪA
        function cleanQuery(text) {
            return text.toLowerCase()
                       .replace(/(feat|feats|scan|scans|profile|hax|chi tiết|cho|về|thông tin|xem)\s+/g, "")
                       .trim();
        }

        function getCharacter(nameRaw) {
            let clean = cleanQuery(nameRaw);
            for (let key in CHARACTERS_DB) {
                if (clean === key || clean.includes(key) || key.includes(clean)) {
                    return CHARACTERS_DB[key];
                }
            }
            return null;
        }

        function processBattle(rawText) {
            let lower = rawText.toLowerCase();

            // 1. KÈO ĐẤU VS
            if (lower.includes(" vs ") || lower.includes(" đấu với ")) {
                let parts = lower.split(/ vs | đấu với /);
                let c1 = getCharacter(parts[0]);
                let c2 = getCharacter(parts[1]);

                if (!c1 || !c2) {
                    addMessage(`⚠️ Không tìm thấy 1 trong 2 nhân vật! Hiện tại DB Offline đã có sẵn Full Feat chi tiết cho: Naruto, Luffy, Sung Jin Woo, Mob, Goku, Saitama, Gojo... Hãy kiểm tra lại từ khóa.`, 'bot');
                    return;
                }

                let winner = (c1.tierVal >= c2.tierVal) ? c1 : c2;
                let loser = (c1.tierVal >= c2.tierVal) ? c2 : c1;
                
                let diffVal = Math.abs(c1.tierVal - c2.tierVal);
                let diff = "NO DIFF";
                if (diffVal < 15 && diffVal >= 8) diff = "LOW DIFF";
                else if (diffVal < 8 && diffVal >= 3) diff = "MID DIFF";
                else if (diffVal < 3) diff = "HIGH DIFF";

                let res = `⚔️ [PHÂN TÍCH KÈO ĐẤU]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n` +
                          `=========================================\n\n` +
                          `📊 1. THÔNG SỐ VSBW:\n` +
                          `• ${c1.name}: Tier [${c1.tierName}] | Speed [${c1.speed}]\n` +
                          `• ${c2.name}: Tier [${c2.tierName}] | Speed [${c2.speed}]\n\n` +
                          `📜 2. FEATS & SCANS NỔI BẬT:\n` +
                          `📌 [${c1.name}]:\n${c1.feats.join("\n")}\n\n` +
                          `📌 [${c2.name}]:\n${c2.feats.join("\n")}\n\n` +
                          `🔮 3. BỘ HAX & RESISTANCE:\n` +
                          `• ${c1.name}: EE [${c1.offense.ee}] | Soul [${c1.offense.soul}]\n` +
                          `• ${c2.name}: EE [${c2.offense.ee}] | Soul [${c2.offense.soul}]\n\n` +
                          `🏆 4. KẾT QUẢ CHUNG CUỘC:\n` +
                          `👉 ${winner.name.toUpperCase()} THẮNG (${diff})\n` +
                          `💡 Lý do: ${winner.name} vượt trội hoàn toàn về cấp độ Tier VSBW, chỉ số Speed và khả năng kháng/tấn công Hax so với ${loser.name}.`;

                addMessage(res, 'bot');
            } 
            // 2. TRA CỨU ĐƠN LẺ FEAT / SCAN
            else {
                let c = getCharacter(rawText);
                if (c) {
                    let res = `📌 [SCAN HỒ SƠ & FEATS - ${c.name.toUpperCase()}]:\n\n` +
                              `📊 Tier VSBW: ${c.tierName}\n` +
                              `⚡ Tốc độ: ${c.speed}\n\n` +
                              `📜 FEATS & SCANS CHÍNH THỨC:\n${c.feats.join("\n")}\n\n` +
                              `🔥 BỘ HAX TẤN CÔNG (OFFENSE):\n• EE: ${c.offense.ee}\n• Soul: ${c.offense.soul}\n\n` +
                              `🛡️ BỘ HAX PHÒNG THỦ (TANK / RESISTANCE):\n• Tank EE: ${c.defense.ee}\n• Tank Soul: ${c.defense.soul}`;
                    addMessage(res, 'bot');
                } else {
                    addMessage(`⚠️ Không tìm thấy nhân vật. Vui lòng nhập: "naruto vs luffy", "sung jin woo vs mob", "goku vs saitama"...`, 'bot');
                }
            }
        }
    </script>
