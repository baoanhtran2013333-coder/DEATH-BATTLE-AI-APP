<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Battle AI Master - Full Feat Engine</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        
        .brand-header { text-align: center; margin-bottom: 20px; }
        .logo-box { display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: #21262d; border: 2px solid #f85149; border-radius: 50%; margin-bottom: 8px; }
        .logo-box svg { width: 32px; height: 32px; fill: #f85149; }
        h1 { color: #f85149; margin: 0; font-size: 24px; font-weight: 800; }
        p.subtitle { color: #8b949e; font-size: 13px; margin-top: 4px; }

        .chat-section { border: 1px solid #30363d; border-radius: 8px; background: #0d1117; overflow: hidden; display: flex; flex-direction: column; height: 550px; }
        .chat-header { background: #21262d; padding: 12px 16px; font-weight: 700; color: #f0f6fc; border-bottom: 1px solid #30363d; font-size: 13px; display: flex; justify-content: space-between; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 1.6; }
        
        .msg { max-width: 90%; padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-start; }
        .msg.user { background: #238636; color: #ffffff; align-self: flex-end; font-weight: 500; }
        .msg.system { background: #21262d; color: #3fb950; align-self: center; font-size: 12px; text-align: center; border: 1px dashed #238636; }

        .chat-input-area { display: flex; padding: 12px; background: #161b22; border-top: 1px solid #30363d; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 14px; outline: none; }
        .chat-input-area button { padding: 12px 20px; background: #f85149; border: none; color: #ffffff; font-weight: 700; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M6.92 5L5 6.92l4.06 4.06-1.42 1.42L3.58 8.34 2.16 9.76l4.25 4.25-3.59 3.59c-.78.78-.78 2.05 0 2.83.78.78 2.05.78 2.83 0l3.59-3.59 4.25 4.25 1.42-1.42-4.06-4.06 1.42-1.42L19 22l1.92-1.92-4.06-4.06 1.42-1.42 4.06 4.06L24 17.08l-4.25-4.25 3.59-3.59c.78-.78.78-2.05 0-2.83-.78-.78-2.05-.78-2.83 0l-3.59 3.59-4.25-4.25-1.42 1.42 4.06 4.06-1.42 1.42L6.92 5z"/></svg>
            </div>
            <h1>DEATH BATTLE AI MASTER</h1>
            <p class="subtitle">Full Feat Canon Database - Phân Tích & Chốt Kèo Trực Tiếp 100%</p>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <span>🤖 VSBW FEAT ENGINE (100% ACCURATE DATA)</span>
                <span style="color: #3fb950;">● READY</span>
            </div>
            
            <div class="chat-messages" id="chatLogs">
                <div class="msg system">⚡ Nhập tên nhân vật (VD: "Feat Sung Jin Woo") hoặc nhập kèo (VD: "Sung Jin Woo vs Goku", "UI Daniel vs Yujiro") để ra ngay Feat chuẩn Canon 100% + Verdict!</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Nhập tên nhân vật hoặc kèo đấu (VD: Sung Jin Woo)..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Gửi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        // BỘ DỮ LIỆU FEAT CANON CHUẨN 100% VSBW
        const VSBW_DATABASE = [
            {
                aliases: ["sung jin woo", "jinwoo", "jin woo", "sung jin-woo", "shadow monarch"],
                name: "Sung Jin-Woo (Solo Leveling / Ragnarok)",
                tierNum: 2.1, // Multi-Universe Level
                tierStr: "Low 2-C đến 2-B (Low Multiverse Level)",
                speedStr: "Immeasurable (Tốc độ vô hạn khi ở Shadow Realm) / Massively FTL+",
                haxStr: "Shadow Extraction (Trích xuất bóng vô hạn), Concept Erasure (Xóa bỏ khái niệm), Immortality (Type 1, 3, 4, 8), Reality Warping, Dimensional Travel, Regeneration (Godly)",
                feats: "• [Canon Solo Leveling Ragnarok]: Kế thừa hoàn toàn sức mạnh của Shadow Monarch Ashborn, một mình chiến đấu và tiêu diệt các Monarch/Ruler ngoài vũ trụ.\n• [Canon Novel Chap 270+]: Quản lý và điều khiển Thức Giới Shadow Realm - một không gian/vũ trụ chứa hàng triệu chiến binh bóng tối vô hạn, tồn tại vượt qua các khái niệm không-thời gian thông thường."
            },
            {
                aliases: ["ui daniel", "daniel park", "daniel vô thức"],
                name: "UI Daniel Park (Lookism)",
                tierNum: 8.0,
                tierStr: "8-A (Multi-City Block Level)",
                speedStr: "Hypersonic+",
                haxStr: "Mastery Copying (Sao chép tuyệt đối mọi kỹ thuật võ học), Unconscious Ultra Instinct (Phản xạ vô thức tối ưu hóa chuyển động), Perfect Body Stats",
                feats: "• [Canon Lookism Chap 467]: Áp đảo Gun, Goo, Jinyoung Park và quét sạch dàn cao thủ Gen 2 nhờ cơ thể hoàn hảo.\n• [Canon Lookism Chap 515]: Thi triển linh hoạt toàn bộ võ thuật cao cấp nhất (Gitae Kim, Taesoo Ma, Gapryong Kim) với lực phát động tối đa."
            },
            {
                aliases: ["yujiro", "yujiro hanma", "hanma yujiro"],
                name: "Yujiro Hanma (Baki the Grappler)",
                tierNum: 8.2,
                tierStr: "8-B đến 8-A (City Block Level)",
                speedStr: "Hypersonic (Mach 5+)",
                haxStr: "Demon Back (Nhân bản sức mạnh), Shaori (Tiêu lực tuyệt đối), Technical Copy, Precognition",
                feats: "• [Canon Baki]: Tung đấm triệt tiêu hoàn toàn trận động đất lớn.\n• [Canon Baki Son of Ogre]: Đi xuyên qua kính chống đạn quân đội Mỹ, đấm gục Baki và đỡ trực diện đòn đánh phá hủy bê tông."
            },
            {
                aliases: ["gojo", "gojo satoru", "satoru"],
                name: "Gojo Satoru (Jujutsu Kaisen)",
                tierNum: 7.0,
                tierStr: "7-A (Mountain Level)",
                speedStr: "Massively Hypersonic+ (Mach 500+)",
                haxStr: "Limitless (Vô Hạn), Infinity Barrier, Six Eyes, Unlimited Void (Nhồi nhét thông tin 4D), Hollow Purple",
                feats: "• [Canon JJK Chap 235]: Thi triển Tử Bát Không (Hollow Purple 200%) xóa sổ toàn bộ vùng tâm chấn Shibuya."
            },
            {
                aliases: ["goku", "son goku", "kakarot"],
                name: "Son Goku (Dragon Ball Super)",
                tierNum: 2.0,
                tierStr: "Low 2-C đến 2-A (Multiverse Level)",
                speedStr: "Immeasurable (Tốc độ vô hạn / Ultra Instinct)",
                haxStr: "God Ki, Ultra Instinct (Auto Dodge), Hakai (Existence Erasure), Instant Transmission",
                feats: "• [Canon DBS Chap 13]: Va chạm đấm Beerus tạo sóng xung kích rung chuyển toàn bộ 4D Macrocosm Vũ Trụ 7."
            },
            {
                aliases: ["saitama", "one punch man"],
                name: "Saitama (One Punch Man)",
                tierNum: 3.5,
                tierStr: "4-A đến 3-C (Multi-Solar System / Galaxy Level)",
                speedStr: "Massively FTL+",
                haxStr: "Exponential Growth (Tăng trưởng sức mạnh vô hạn), Non-Physical Interaction (Cầm nắm cổng không gian 4D)",
                feats: "• [Canon OPM Chap 167-168]: Serious Punch Squall thổi bay hàng triệu hệ sao; Serious Sneeze thổi bay bầu khí quyển Sao Mộc."
            },
            {
                aliases: ["sukuna", "ryomen sukuna"],
                name: "Ryomen Sukuna (Jujutsu Kaisen)",
                tierNum: 7.1,
                tierStr: "7-A (Mountain Level)",
                speedStr: "Massively Hypersonic+",
                haxStr: "Dismantle & Cleave, World Severing Slash (Cut Concept of Space), Malevolent Shrine",
                feats: "• [Canon JJK Chap 236]: World Cutting Slash chém đứt khái niệm không gian bao quanh Gojo Satoru."
            }
        ];

        function addMessage(text, type) {
            const chatLogs = document.getElementById('chatLogs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerText = text;
            chatLogs.appendChild(msgDiv);
            chatLogs.scrollTop = chatLogs.scrollHeight;
        }

        function findCharacter(str) {
            const cleanStr = str.toLowerCase().trim();
            return VSBW_DATABASE.find(c => 
                c.aliases.some(alias => cleanStr.includes(alias)) || cleanStr.includes(c.name.toLowerCase())
            );
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const rawText = input.value.trim();
            if (!rawText) return;

            addMessage(rawText, 'user');
            input.value = '';

            setTimeout(() => {
                processQuery(rawText);
            }, 100);
        }

        function processQuery(query) {
            const q = query.toLowerCase();

            // KỊCH BẢN 1: KÈO ĐẤU (Ví dụ: "Sung Jin Woo vs Goku", "UI Daniel vs Yujiro")
            if (q.includes("vs") || q.includes("đấu") || q.includes("so sánh")) {
                let parts = q.split(/vs|đấu với|với|đấu|so sánh/);
                let c1 = findCharacter(parts[0] || "");
                let c2 = findCharacter(parts[1] || "");

                if (c1 && c2) {
                    let winner = "";
                    let reason = "";

                    if (c1.tierNum < c2.tierNum) {
                        winner = c1.name.toUpperCase();
                        reason = `${c1.name} vượt trội hoàn toàn về Tiering System (${c1.tierStr} vs ${c2.tierStr}) và Tốc độ (${c1.speedStr}).`;
                    } else if (c2.tierNum < c1.tierNum) {
                        winner = c2.name.toUpperCase();
                        reason = `${c2.name} vượt trội hoàn toàn về Tiering System (${c2.tierStr} vs ${c1.tierStr}) và Tốc độ (${c2.speedStr}).`;
                    } else {
                        winner = c1.name.toUpperCase();
                        reason = `Cả hai cùng Tier, nhưng ${c1.name} có bộ Hax và tốc độ nhỉnh hơn trong combat cận chiến.`;
                    }

                    let res = `⚔️ [PHÂN TÍCH KÈO ĐẤU CANON]: ${c1.name.toUpperCase()} VS ${c2.name.toUpperCase()}\n\n` +
                              `📊 1. THÔNG SỐ VSBW:\n` +
                              `• ${c1.name}: Tier [${c1.tierStr}] | Speed [${c1.speedStr}]\n` +
                              `• ${c2.name}: Tier [${c2.tierStr}] | Speed [${c2.speedStr}]\n\n` +
                              `🔥 2. FEAT CANON 100% TRÍCH DẪN:\n` +
                              `${c1.feats}\n` +
                              `${c2.feats}\n\n` +
                              `🔮 3. NĂNG LỰC / HAX:\n` +
                              `• ${c1.name.split(' ')[0]}: ${c1.haxStr}\n` +
                              `• ${c2.name.split(' ')[0]}: ${c2.haxStr}\n\n` +
                              `🏆 [VERDICT - PHÁN QUYẾT]: ${winner} THẮNG!\n` +
                              `👉 Lý do: ${reason}`;
                    addMessage(res, 'bot');
                    return;
                }
            }

            // KỊCH BẢN 2: CHỈ XIN FEAT CỦA 1 NHÂN VẬT (Ví dụ: "Feat Sung Jin Woo", "Hồ sơ Gojo")
            let singleChar = findCharacter(q);
            if (singleChar) {
                let res = `📜 [HỒ SƠ CANON & FEAT CHUẨN 100% VSBW]: ${singleChar.name.toUpperCase()}\n\n` +
                          `📌 Phân Cấp (Tier): ${singleChar.tierStr}\n` +
                          `⚡ Tốc Độ (Speed): ${singleChar.speedStr}\n` +
                          `🔮 Hax & Năng Lực: ${singleChar.haxStr}\n\n` +
                          `🔥 FEAT CANON TRÍCH DẪN CHI TIẾT:\n` +
                          `${singleChar.feats}`;
                addMessage(res, 'bot');
                return;
            }

            // KỊCH BẢN 3: NHÂN VẬT CHƯA CÓ TRONG DATA CỐ ĐỊNH -> HIỂN THỊ THÔNG BÁO RÕ RÀNG
            let res = `⚠️ [THÔNG BÁO VSBW DATABASE]:\n` +
                      `Nhân vật trong câu hỏi của bạn chưa nằm trong danh sách dữ liệu Offline hiện tại.\n\n` +
                      `💡 Gợi ý: Bạn hãy thêm thông tin nhân vật đó vào mảng \`VSBW_DATABASE\` trong code JS, hoặc thử gõ các nhân vật có sẵn như: "Sung Jin Woo", "UI Daniel", "Yujiro", "Gojo", "Goku", "Saitama", "Sukuna"!`;
            addMessage(res, 'bot');
        }
    </script>
</body>
</html>
